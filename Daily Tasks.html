<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Gee's tasks</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel-2:#1e222c; --line:#2a2f3a;
    --txt:#e8eaf0; --muted:#9aa3b2; --accent:#5b8cff; --accent-2:#3a6bdc;
    --hi:#ff5d6c; --med:#ffb02e; --lo:#3ecf8e; --done:#5a6173;
    --chip:#232838; --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(180deg,#0f1115,#0c0e12);color:var(--txt);
    -webkit-font-smoothing:antialiased;min-height:100vh;line-height:1.5;
  }
  .wrap{max-width:760px;margin:0 auto;padding:24px 16px 80px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  h1{font-size:1.5rem;font-weight:700;letter-spacing:-.02em}
  h1 span{color:var(--accent)}
  .date{color:var(--muted);font-size:.9rem}
  .stats{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 18px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.82rem;color:var(--muted)}
  .stat b{color:var(--txt);font-size:1rem;display:block}
  .stat.alert b{color:var(--hi)}
  form.add{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow);margin-bottom:16px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  input,select,button,textarea{font:inherit;color:var(--txt)}
  input[type=text],input[type=date],select{
    background:var(--panel-2);border:1px solid var(--line);border-radius:9px;
    padding:10px 12px;outline:none;min-height:44px
  }
  input[type=text]#title{flex:1;min-width:180px;font-size:1rem}
  input:focus,select:focus{border-color:var(--accent)}
  .add .sub{margin-top:8px;align-items:center}
  button{cursor:pointer;border:none;border-radius:9px;background:var(--accent);color:#fff;
    padding:10px 16px;font-weight:600;min-height:44px;transition:filter .15s,transform .05s}
  button:hover{filter:brightness(1.08)} button:active{transform:translateY(1px)}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
  button.ghost:hover{color:var(--txt);border-color:var(--accent)}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;flex-wrap:wrap}
  .tab{background:transparent;color:var(--muted);padding:8px 14px;border-radius:7px;font-size:.88rem;min-height:auto}
  .tab.active{background:var(--accent);color:#fff}
  .tab .n{opacity:.7;font-size:.8em;margin-left:5px}
  .search{flex:1;min-width:140px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .chip{background:var(--chip);border:1px solid var(--line);color:var(--muted);
    padding:6px 12px;border-radius:999px;font-size:.8rem;cursor:pointer;min-height:auto}
  .chip.active{background:var(--accent-2);color:#fff;border-color:transparent}
  ul.list{list-style:none;display:flex;flex-direction:column;gap:8px}
  .group-label{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;margin:16px 0 4px;font-weight:700}
  li.task{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;display:flex;gap:12px;align-items:flex-start;transition:border-color .15s}
  li.task:hover{border-color:#384055}
  li.task.done{opacity:.55}
  li.task.done .ttl{text-decoration:line-through;color:var(--done)}
  .cbx{appearance:none;-webkit-appearance:none;width:22px;height:22px;border:2px solid var(--line);
    border-radius:7px;cursor:pointer;flex-shrink:0;margin-top:1px;position:relative;background:var(--panel-2)}
  .cbx:checked{background:var(--lo);border-color:var(--lo)}
  .cbx:checked::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;
    border:solid #0f1115;border-width:0 3px 3px 0;transform:rotate(45deg)}
  .pdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:7px}
  .p-high{background:var(--hi)} .p-med{background:var(--med)} .p-low{background:var(--lo)}
  .body{flex:1;min-width:0}
  .ttl{font-size:.98rem;word-break:break-word;cursor:text}
  .meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
  .badge{font-size:.72rem;padding:3px 8px;border-radius:999px;background:var(--chip);color:var(--muted)}
  .badge.cat{color:var(--accent)}
  .badge.due{color:var(--muted)}
  .badge.due.today{background:rgba(255,176,46,.15);color:var(--med)}
  .badge.due.over{background:rgba(255,93,108,.15);color:var(--hi)}
  .badge.rec{color:var(--lo)}
  .acts{display:flex;gap:4px;flex-shrink:0}
  .icon{background:transparent;border:none;color:var(--muted);font-size:1rem;padding:6px;min-height:auto;border-radius:6px;width:32px;height:32px}
  .icon:hover{background:var(--panel-2);color:var(--txt)}
  .empty{text-align:center;color:var(--muted);padding:48px 16px}
  .empty .big{font-size:2.4rem;margin-bottom:8px}
  footer{margin-top:28px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  footer button{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:500;font-size:.83rem}
  footer button:hover{color:var(--txt);border-color:var(--accent)}
  .hint{color:var(--muted);font-size:.75rem;text-align:center;margin-top:10px}
  /* modal */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
  .ov.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:440px;width:100%;box-shadow:var(--shadow)}
  .modal h3{margin-bottom:14px}
  .modal label{display:block;font-size:.8rem;color:var(--muted);margin:10px 0 4px}
  .modal input,.modal select{width:100%}
  .modal .row{margin-top:16px;justify-content:flex-end}
  @media(max-width:520px){ .wrap{padding:16px 12px 80px} h1{font-size:1.3rem} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Gee's <span>tasks</span></h1>
      <div class="date" id="todayLabel"></div>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <form class="add" id="addForm" autocomplete="off">
    <div class="row">
      <input type="text" id="title" placeholder="Add a task and press Enter…" required aria-label="Task title" />
      <button type="submit">Add</button>
    </div>
    <div class="row sub">
      <input type="date" id="due" aria-label="Due date" />
      <select id="priority" aria-label="Priority">
        <option value="med">◐ Medium priority</option>
        <option value="high">● High priority</option>
        <option value="low">○ Low priority</option>
      </select>
      <input type="text" id="cat" list="cats" placeholder="Category (optional)" aria-label="Category" style="min-width:150px" />
      <datalist id="cats"></datalist>
      <select id="recur" aria-label="Repeat">
        <option value="none">No repeat</option>
        <option value="daily">Repeat daily</option>
        <option value="weekly">Repeat weekly</option>
      </select>
    </div>
  </form>

  <div class="toolbar">
    <div class="tabs" id="tabs">
      <button class="tab active" data-view="today">Today <span class="n" id="n-today"></span></button>
      <button class="tab" data-view="upcoming">Upcoming <span class="n" id="n-upcoming"></span></button>
      <button class="tab" data-view="all">All <span class="n" id="n-all"></span></button>
      <button class="tab" data-view="done">Done <span class="n" id="n-done"></span></button>
    </div>
    <input type="text" id="search" class="search" placeholder="Search…" aria-label="Search tasks" />
  </div>

  <div class="chips" id="catChips"></div>

  <ul class="list" id="list"></ul>

  <footer>
    <button id="exportBtn">⬇ Backup (export)</button>
    <button id="importBtn">⬆ Restore (import)</button>
    <input type="file" id="importFile" accept="application/json" hidden />
    <button id="clearDone">🧹 Clear completed</button>
  </footer>
  <div class="hint">Saved automatically on this device. Use Backup to keep a copy or move to another device.</div>
</div>

<div class="ov" id="ov">
  <div class="modal">
    <h3>Edit task</h3>
    <label>Title</label><input type="text" id="m-title" />
    <label>Due date</label><input type="date" id="m-due" />
    <label>Priority</label>
    <select id="m-priority"><option value="high">High</option><option value="med">Medium</option><option value="low">Low</option></select>
    <label>Category</label><input type="text" id="m-cat" list="cats" />
    <label>Repeat</label>
    <select id="m-recur"><option value="none">No repeat</option><option value="daily">Daily</option><option value="weekly">Weekly</option></select>
    <div class="row">
      <button class="ghost" id="m-cancel">Cancel</button>
      <button id="m-save">Save</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var KEY="dailyTasks.v1";
  var tasks=[], view="today", catFilter=null, search="", editId=null;

  /* ---------- storage ---------- */
  function load(){
    try{ tasks=JSON.parse(localStorage.getItem(KEY))||[]; }catch(e){ tasks=[]; }
    if(!Array.isArray(tasks)) tasks=[];
  }
  function save(){ localStorage.setItem(KEY, JSON.stringify(tasks)); }

  /* ---------- date helpers ---------- */
  function todayStr(){ var d=new Date(); return iso(d); }
  function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function addDays(s,n){ var d=new Date(s+"T00:00:00"); d.setDate(d.getDate()+n); return iso(d); }
  function prettyToday(){
    return new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"});
  }
  function dueLabel(s){
    if(!s) return null;
    var t=todayStr();
    if(s<t) return {cls:"over",txt:relDays(s)+" overdue"};
    if(s===t) return {cls:"today",txt:"Today"};
    if(s===addDays(t,1)) return {cls:"",txt:"Tomorrow"};
    var d=new Date(s+"T00:00:00");
    return {cls:"",txt:d.toLocaleDateString(undefined,{month:"short",day:"numeric"})};
  }
  function relDays(s){
    var a=new Date(todayStr()+"T00:00:00"), b=new Date(s+"T00:00:00");
    var n=Math.round((a-b)/86400000); return n+(n===1?" day":" days");
  }

  /* ---------- model ---------- */
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function addTask(o){
    tasks.push({id:uid(),title:o.title,done:false,due:o.due||"",priority:o.priority||"med",
                cat:(o.cat||"").trim(),recur:o.recur||"none",created:Date.now()});
    save();
  }
  function nextDue(s,rec){
    var base = s && s>=todayStr() ? s : todayStr();
    return rec==="daily"? addDays(base,1) : rec==="weekly"? addDays(base,7) : "";
  }
  function toggle(id){
    var t=tasks.find(function(x){return x.id===id;}); if(!t) return;
    t.done=!t.done;
    if(t.done && t.recur && t.recur!=="none"){
      tasks.push({id:uid(),title:t.title,done:false,due:nextDue(t.due,t.recur),
                  priority:t.priority,cat:t.cat,recur:t.recur,created:Date.now()});
    }
    save(); render();
  }
  function del(id){ tasks=tasks.filter(function(x){return x.id!==id;}); save(); render(); }

  /* ---------- filtering / sorting ---------- */
  var PRANK={high:0,med:1,low:2};
  function visible(){
    var t=todayStr();
    return tasks.filter(function(x){
      if(search && x.title.toLowerCase().indexOf(search.toLowerCase())<0) return false;
      if(catFilter && (x.cat||"")!==catFilter) return false;
      if(view==="done") return x.done;
      if(x.done) return false;
      if(view==="today")    return (x.due && x.due<=t) || !x.due;
      if(view==="upcoming") return x.due && x.due>t;
      return true; /* all */
    }).sort(function(a,b){
      if(a.due&&b.due&&a.due!==b.due) return a.due<b.due?-1:1;
      if(a.due&&!b.due) return -1;
      if(!a.due&&b.due) return 1;
      if(PRANK[a.priority]!==PRANK[b.priority]) return PRANK[a.priority]-PRANK[b.priority];
      return a.created-b.created;
    });
  }
  function counts(){
    var t=todayStr(), c={today:0,upcoming:0,all:0,done:0,over:0};
    tasks.forEach(function(x){
      if(x.done){c.done++;return;}
      c.all++;
      if(x.due&&x.due<t) c.over++;
      if((x.due&&x.due<=t)||!x.due) c.today++;
      if(x.due&&x.due>t) c.upcoming++;
    });
    return c;
  }

  /* ---------- render ---------- */
  var $=function(s){return document.querySelector(s);};
  function render(){
    $("#todayLabel").textContent=prettyToday();
    var c=counts();
    ["today","upcoming","all","done"].forEach(function(k){ $("#n-"+k).textContent=c[k]; });
    $("#stats").innerHTML=
      stat(c.today,"due / overdue today",c.over>0)+
      stat(c.done,"completed")+
      stat(c.all,"open total")+
      (c.over>0?stat(c.over,"overdue",true):"");

    // category chips + datalist
    var catset={}; tasks.forEach(function(x){ if(x.cat) catset[x.cat]=1; });
    var cats=Object.keys(catset).sort();
    $("#cats").innerHTML=cats.map(function(x){return '<option value="'+esc(x)+'">';}).join("");
    $("#catChips").innerHTML = cats.length? cats.map(function(x){
      return '<button class="chip'+(catFilter===x?' active':'')+'" data-cat="'+esc(x)+'">'+esc(x)+'</button>';
    }).join("")+(catFilter?'<button class="chip" data-cat="">✕ clear</button>':"") :"";

    var v=visible(), list=$("#list");
    if(!v.length){
      list.innerHTML='<div class="empty"><div class="big">'+(view==="done"?"🗂️":"✓")+'</div>'+
        (view==="done"?"No completed tasks yet.":"Nothing here. Add a task above to get started.")+'</div>';
      return;
    }
    var html="", lastG=null;
    v.forEach(function(x){
      if(view==="all"||view==="today"){
        var g=groupOf(x);
        if(g!==lastG){ html+='<div class="group-label">'+g+'</div>'; lastG=g; }
      }
      html+=row(x);
    });
    list.innerHTML=html;
  }
  function groupOf(x){
    if(x.done) return "Completed";
    if(!x.due) return "No date";
    var t=todayStr();
    if(x.due<t) return "Overdue";
    if(x.due===t) return "Today";
    return "Upcoming";
  }
  function stat(n,l,alert){ return '<div class="stat'+(alert?' alert':'')+'"><b>'+n+'</b>'+l+'</div>'; }
  function esc(s){ return String(s).replace(/[&<>"']/g,function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]; }); }
  function row(x){
    var d=dueLabel(x.due);
    return '<li class="task'+(x.done?' done':'')+'" data-id="'+x.id+'">'+
      '<input type="checkbox" class="cbx" '+(x.done?'checked':'')+' aria-label="Complete" />'+
      '<span class="pdot p-'+x.priority+'" title="'+x.priority+' priority"></span>'+
      '<div class="body"><div class="ttl" data-edit>'+esc(x.title)+'</div><div class="meta">'+
        (d?'<span class="badge due '+d.cls+'">'+d.txt+'</span>':'')+
        (x.cat?'<span class="badge cat">'+esc(x.cat)+'</span>':'')+
        (x.recur&&x.recur!=="none"?'<span class="badge rec">↻ '+x.recur+'</span>':'')+
      '</div></div>'+
      '<div class="acts">'+
        '<button class="icon" data-act="edit" title="Edit">✎</button>'+
        '<button class="icon" data-act="del" title="Delete">🗑</button>'+
      '</div></li>';
  }

  /* ---------- events ---------- */
  $("#addForm").addEventListener("submit",function(e){
    e.preventDefault();
    var ttl=$("#title").value.trim(); if(!ttl) return;
    addTask({title:ttl,due:$("#due").value,priority:$("#priority").value,
             cat:$("#cat").value,recur:$("#recur").value});
    this.reset(); $("#priority").value="med"; $("#title").focus(); render();
  });
  $("#tabs").addEventListener("click",function(e){
    var b=e.target.closest(".tab"); if(!b) return;
    view=b.dataset.view;
    [].forEach.call(this.children,function(t){ t.classList.toggle("active",t===b); });
    render();
  });
  $("#catChips").addEventListener("click",function(e){
    var b=e.target.closest(".chip"); if(!b) return;
    catFilter=b.dataset.cat||null; render();
  });
  $("#search").addEventListener("input",function(){ search=this.value; render(); });
  $("#list").addEventListener("click",function(e){
    var li=e.target.closest("li.task"); if(!li) return; var id=li.dataset.id;
    if(e.target.classList.contains("cbx")) return toggle(id);
    var act=e.target.closest("[data-act]");
    if(act&&act.dataset.act==="del"){ if(confirm("Delete this task?")) del(id); return; }
    if(act&&act.dataset.act==="edit"){ openEdit(id); return; }
    if(e.target.hasAttribute("data-edit")) openEdit(id);
  });

  /* edit modal */
  function openEdit(id){
    var t=tasks.find(function(x){return x.id===id;}); if(!t) return;
    editId=id;
    $("#m-title").value=t.title; $("#m-due").value=t.due||"";
    $("#m-priority").value=t.priority; $("#m-cat").value=t.cat||"";
    $("#m-recur").value=t.recur||"none";
    $("#ov").classList.add("show"); $("#m-title").focus();
  }
  function closeEdit(){ $("#ov").classList.remove("show"); editId=null; }
  $("#m-cancel").addEventListener("click",closeEdit);
  $("#ov").addEventListener("click",function(e){ if(e.target===this) closeEdit(); });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeEdit(); });
  $("#m-save").addEventListener("click",function(){
    var t=tasks.find(function(x){return x.id===editId;}); if(!t) return;
    var nt=$("#m-title").value.trim(); if(!nt){ $("#m-title").focus(); return; }
    t.title=nt; t.due=$("#m-due").value; t.priority=$("#m-priority").value;
    t.cat=$("#m-cat").value.trim(); t.recur=$("#m-recur").value;
    save(); closeEdit(); render();
  });

  /* backup / restore / clear */
  $("#exportBtn").addEventListener("click",function(){
    var blob=new Blob([JSON.stringify(tasks,null,2)],{type:"application/json"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="daily-tasks-backup-"+todayStr()+".json";
    a.click(); URL.revokeObjectURL(a.href);
  });
  $("#importBtn").addEventListener("click",function(){ $("#importFile").click(); });
  $("#importFile").addEventListener("change",function(e){
    var f=e.target.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var data=JSON.parse(r.result);
        if(!Array.isArray(data)) throw 0;
        if(confirm("Import "+data.length+" tasks? This replaces your current list.")){
          tasks=data; save(); render();
        }
      }catch(_){ alert("That file isn't a valid backup."); }
      e.target.value="";
    };
    r.readAsText(f);
  });
  $("#clearDone").addEventListener("click",function(){
    var n=tasks.filter(function(x){return x.done;}).length;
    if(!n) return alert("No completed tasks to clear.");
    if(confirm("Permanently remove "+n+" completed task(s)?")){
      tasks=tasks.filter(function(x){return !x.done;}); save(); render();
    }
  });

  load(); render(); $("#title").focus();
})();
</script>
</body>
</html>
