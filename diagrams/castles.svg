<svg viewBox="0 0 340 200" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="340" height="200" fill="#e8e8e8"/>
  <text x="170" y="13" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">MEDIEVAL CASTLE</text>
  <!-- Sky background inside castle area -->
  <rect x="30" y="20" width="280" height="160" fill="#d0dae8" rx="2"/>
  <!-- Moat -->
  <rect x="30" y="168" width="280" height="18" rx="4" fill="#7eb8d4"/>
  <path d="M40,170 Q80,165 120,170 Q160,175 200,170 Q240,165 280,170 Q300,172 310,175" stroke="#5a9ab8" stroke-width="1.5" fill="none"/>
  <text x="170" y="180" text-anchor="middle" font-size="8" font-weight="bold" fill="#1a5c7a">MOAT</text>
  <!-- Drawbridge -->
  <rect x="148" y="148" width="44" height="20" fill="#8d6e63" stroke="#6d4c41" stroke-width="1.5"/>
  <text x="170" y="160" text-anchor="middle" font-size="8" font-weight="bold" fill="#4e342e">DRAW-BRIDGE</text>
  <!-- Main keep/wall -->
  <rect x="80" y="90" width="180" height="78" fill="#b0bec5" stroke="#78909c" stroke-width="2"/>
  <!-- Gate arch -->
  <path d="M148,168 L148,138 Q170,120 192,138 L192,168" fill="#5d4037" stroke="#4e342e" stroke-width="1.5"/>
  <!-- Wall battlements -->
  <rect x="80" y="82" width="12" height="10" fill="#b0bec5" stroke="#78909c" stroke-width="1.5"/>
  <rect x="100" y="82" width="12" height="10" fill="#b0bec5" stroke="#78909c" stroke-width="1.5"/>
  <rect x="120" y="82" width="12" height="10" fill="#b0bec5" stroke="#78909c" stroke-width="1.5"/>
  <rect x="208" y="82" width="12" height="10" fill="#b0bec5" stroke="#78909c" stroke-width="1.5"/>
  <rect x="228" y="82" width="12" height="10" fill="#b0bec5" stroke="#78909c" stroke-width="1.5"/>
  <rect x="248" y="82" width="12" height="10" fill="#b0bec5" stroke="#78909c" stroke-width="1.5"/>
  <text x="170" y="100" text-anchor="middle" font-size="8" font-weight="bold" fill="#4e342e">KEEP</text>
  <!-- Left tower -->
  <rect x="35" y="50" width="55" height="118" fill="#9e9e9e" stroke="#757575" stroke-width="2"/>
  <!-- Left tower battlements -->
  <rect x="35" y="40" width="10" height="12" fill="#9e9e9e" stroke="#757575" stroke-width="1.5"/>
  <rect x="52" y="40" width="10" height="12" fill="#9e9e9e" stroke="#757575" stroke-width="1.5"/>
  <rect x="69" y="40" width="10" height="12" fill="#9e9e9e" stroke="#757575" stroke-width="1.5"/>
  <!-- Left tower windows -->
  <rect x="52" y="68" width="14" height="18" rx="3" fill="#607d8b"/>
  <rect x="52" y="100" width="14" height="18" rx="3" fill="#607d8b"/>
  <text x="62" y="182" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#333">TOWER</text>
  <!-- Right tower -->
  <rect x="250" y="50" width="55" height="118" fill="#9e9e9e" stroke="#757575" stroke-width="2"/>
  <rect x="250" y="40" width="10" height="12" fill="#9e9e9e" stroke="#757575" stroke-width="1.5"/>
  <rect x="267" y="40" width="10" height="12" fill="#9e9e9e" stroke="#757575" stroke-width="1.5"/>
  <rect x="284" y="40" width="10" height="12" fill="#9e9e9e" stroke="#757575" stroke-width="1.5"/>
  <rect x="270" y="68" width="14" height="18" rx="3" fill="#607d8b"/>
  <rect x="270" y="100" width="14" height="18" rx="3" fill="#607d8b"/>
  <!-- Labels -->
  <text x="10" y="55" text-anchor="end" font-size="8" font-weight="bold" fill="#333">TOWER</text>
  <line x1="35" y1="55" x2="12" y2="55" stroke="#333" stroke-width="1"/>
  <text x="330" y="55" font-size="8" font-weight="bold" fill="#333">TOWER</text>
  <line x1="305" y1="55" x2="328" y2="55" stroke="#333" stroke-width="1"/>
  <text x="5" y="90" text-anchor="end" font-size="8" font-weight="bold" fill="#333">BATTLE-</text>
  <text x="5" y="100" text-anchor="end" font-size="8" font-weight="bold" fill="#333">MENTS</text>
  <line x1="80" y1="87" x2="8" y2="95" stroke="#333" stroke-width="1"/>
  <text x="335" y="98" font-size="8" font-weight="bold" fill="#333">GATE</text>
  <line x1="192" y1="140" x2="333" y2="98" stroke="#333" stroke-width="1"/>
</svg>