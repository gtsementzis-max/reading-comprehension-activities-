<svg viewBox="0 0 340 200" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="340" height="200" fill="#eef2f7"/>
  <text x="170" y="14" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a237e">WHEEL &amp; AXLE — SIMPLE MACHINE</text>
  <!-- Axle -->
  <rect x="60" y="92" width="220" height="16" rx="8" fill="#78909c" stroke="#546e7a" stroke-width="2"/>
  <text x="170" y="125" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a237e">AXLE</text>
  <line x1="170" y1="108" x2="170" y2="120" stroke="#333" stroke-width="1"/>
  <!-- Wheel (large circle) -->
  <circle cx="170" cy="100" r="72" fill="#e3f2fd" stroke="#1565c0" stroke-width="3"/>
  <!-- Rim label -->
  <text x="247" y="98" font-size="9" font-weight="bold" fill="#1565c0">RIM</text>
  <!-- Spokes -->
  <line x1="170" y1="100" x2="170" y2="30" stroke="#1565c0" stroke-width="2.5"/>
  <line x1="170" y1="100" x2="170" y2="170" stroke="#1565c0" stroke-width="2.5"/>
  <line x1="170" y1="100" x2="100" y2="100" stroke="#1565c0" stroke-width="2.5"/>
  <line x1="170" y1="100" x2="240" y2="100" stroke="#1565c0" stroke-width="2.5"/>
  <line x1="170" y1="100" x2="122" y2="52" stroke="#1565c0" stroke-width="2.5"/>
  <line x1="170" y1="100" x2="218" y2="148" stroke="#1565c0" stroke-width="2.5"/>
  <!-- Hub -->
  <circle cx="170" cy="100" r="12" fill="#78909c" stroke="#546e7a" stroke-width="2"/>
  <text x="170" y="104" text-anchor="middle" font-size="8" font-weight="bold" fill="white">HUB</text>
  <!-- Spoke label -->
  <line x1="170" y1="65" x2="210" y2="55" stroke="#333" stroke-width="1"/>
  <text x="215" y="53" font-size="9" font-weight="bold" fill="#1a237e">SPOKE</text>
  <!-- Wheel label -->
  <text x="105" y="40" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a237e">WHEEL</text>
  <line x1="122" y1="40" x2="138" y2="55" stroke="#333" stroke-width="1"/>
  <!-- Force curved arrow on wheel -->
  <path d="M228,60 A72,72 0 0,1 242,100" stroke="#e53935" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <polygon points="242,100 252,92 246,105" fill="#e53935"/>
  <text x="255" y="78" font-size="8" font-weight="bold" fill="#e53935">FORCE</text>
  <!-- Movement arrow on axle -->
  <path d="M60,100 L30,100" stroke="#43a047" stroke-width="2" fill="none"/>
  <polygon points="30,100 42,95 42,105" fill="#43a047"/>
  <text x="18" y="88" text-anchor="middle" font-size="8" font-weight="bold" fill="#43a047">MOVE</text>
</svg>