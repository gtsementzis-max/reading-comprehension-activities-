<svg viewBox="0 0 340 200" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="340" height="200" fill="#e8f5e8"/>
  <text x="170" y="14" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e20">BOA CONSTRICTOR</text>
  <!-- Snake body S-curve -->
  <path d="M55,80 Q100,30 170,70 Q240,110 280,70 Q310,45 320,60 Q325,70 315,75" stroke="#5d8a3c" stroke-width="22" fill="none" stroke-linecap="round"/>
  <!-- Scale pattern overlay -->
  <path d="M55,80 Q100,30 170,70 Q240,110 280,70 Q310,45 320,60 Q325,70 315,75" stroke="#4a7a2e" stroke-width="20" fill="none" stroke-linecap="round" stroke-dasharray="8,8"/>
  <!-- Head -->
  <ellipse cx="48" cy="82" rx="22" ry="14" fill="#4a7a2e" stroke="#2e5e18" stroke-width="2"/>
  <!-- Eye -->
  <ellipse cx="40" cy="78" rx="5" ry="4" fill="#222"/>
  <circle cx="39" cy="77" r="1.5" fill="#ffd54f"/>
  <!-- Jaw line -->
  <path d="M30,88 Q48,92 66,88" stroke="#2e5e18" stroke-width="1.5" fill="none"/>
  <!-- Tongue -->
  <line x1="28" y1="84" x2="18" y2="80" stroke="#e53935" stroke-width="1.5"/>
  <line x1="18" y1="80" x2="12" y2="76" stroke="#e53935" stroke-width="1.5"/>
  <line x1="18" y1="80" x2="12" y2="84" stroke="#e53935" stroke-width="1.5"/>
  <!-- Tail tip -->
  <ellipse cx="315" cy="76" rx="8" ry="5" fill="#2e5e18" stroke="#1b4010" stroke-width="1.5"/>
  <!-- Labels -->
  <line x1="48" y1="70" x2="48" y2="40" stroke="#333" stroke-width="1"/>
  <text x="48" y="36" text-anchor="middle" font-size="9" font-weight="bold" fill="#1b5e20">HEAD</text>
  <line x1="40" y1="78" x2="15" y2="65" stroke="#333" stroke-width="1"/>
  <text x="10" y="62" text-anchor="end" font-size="9" font-weight="bold" fill="#1b5e20">EYE</text>
  <line x1="16" y1="80" x2="6" y2="95" stroke="#333" stroke-width="1"/>
  <text x="5" y="108" text-anchor="middle" font-size="9" font-weight="bold" fill="#1b5e20">TONGUE</text>
  <line x1="170" y1="60" x2="170" y2="35" stroke="#333" stroke-width="1"/>
  <text x="170" y="31" text-anchor="middle" font-size="9" font-weight="bold" fill="#1b5e20">SCALES</text>
  <line x1="170" y1="80" x2="170" y2="160" stroke="#333" stroke-width="1"/>
  <text x="170" y="172" text-anchor="middle" font-size="9" font-weight="bold" fill="#1b5e20">BODY</text>
  <line x1="50" y1="90" x2="60" y2="115" stroke="#333" stroke-width="1"/>
  <text x="60" y="128" text-anchor="middle" font-size="9" font-weight="bold" fill="#1b5e20">JAW</text>
  <line x1="315" y1="80" x2="315" y2="100" stroke="#333" stroke-width="1"/>
  <text x="315" y="112" text-anchor="middle" font-size="9" font-weight="bold" fill="#1b5e20">TAIL</text>
</svg>