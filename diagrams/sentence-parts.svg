<svg viewBox="0 0 340 200" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="340" height="200" fill="#f7f4fe"/>
  <text x="170" y="15" text-anchor="middle" font-size="12" font-weight="bold" fill="#311b92">PARTS OF A SENTENCE</text>

  <!-- The example sentence, laid out in segments so the markers line up -->
  <rect x="14" y="32" width="312" height="34" rx="7" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="68"  y="53" text-anchor="middle" font-size="12" fill="#311b92">The tall girl</text>
  <text x="130" y="53" text-anchor="middle" font-size="12" fill="#311b92">rode</text>
  <text x="180" y="53" text-anchor="middle" font-size="12" fill="#311b92">her bike</text>
  <text x="252" y="53" text-anchor="middle" font-size="12" fill="#311b92">to school.</text>

  <!-- Markers -->
  <line x1="30" y1="60" x2="106" y2="60" stroke="#5e35b1" stroke-width="2"/>
  <line x1="115" y1="60" x2="145" y2="60" stroke="#c62828" stroke-width="2"/>
  <path d="M224 60 L224 66 L281 66 L281 60" fill="none" stroke="#ef6c00" stroke-width="2"/>

  <text x="68"  y="80" text-anchor="middle" font-size="9" font-weight="bold" fill="#5e35b1">SUBJECT</text>
  <text x="68"  y="89" text-anchor="middle" font-size="7" fill="#6b5b8a">who it is about</text>
  <text x="130" y="80" text-anchor="middle" font-size="9" font-weight="bold" fill="#c62828">VERB</text>
  <text x="130" y="89" text-anchor="middle" font-size="7" fill="#8a3b3b">the action</text>
  <text x="252" y="80" text-anchor="middle" font-size="9" font-weight="bold" fill="#ef6c00">PHRASE</text>
  <text x="252" y="89" text-anchor="middle" font-size="7" fill="#8a5a20">no subject + verb</text>

  <line x1="14" y1="104" x2="326" y2="104" stroke="#d5cbe8" stroke-width="1.5"/>

  <!-- Phrase on its own: not a sentence -->
  <circle cx="22" cy="132" r="8" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <line x1="18" y1="128" x2="26" y2="136" stroke="#c62828" stroke-width="1.8"/>
  <line x1="26" y1="128" x2="18" y2="136" stroke="#c62828" stroke-width="1.8"/>
  <text x="38" y="124" font-size="8" font-weight="bold" fill="#c62828">PHRASE — cannot stand on its own</text>
  <text x="38" y="139" font-size="11" font-style="italic" fill="#4a3b60">under the wooden bridge</text>

  <!-- Add a subject + verb: now it is a sentence -->
  <circle cx="22" cy="170" r="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <polyline points="18,170 21,174 27,166" fill="none" stroke="#2e7d32" stroke-width="1.8"/>
  <text x="38" y="162" font-size="8" font-weight="bold" fill="#2e7d32">SENTENCE — subject + verb + complete thought</text>
  <text x="38" y="177" font-size="11" fill="#4a3b60">The troll hid under the wooden bridge.</text>
</svg>
