<svg viewBox="0 0 340 200" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#29b6f6"/>
      <stop offset="40%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#010a14"/>
    </linearGradient>
  </defs>
  <rect width="340" height="200" fill="url(#ocean)"/>
  <text x="170" y="14" text-anchor="middle" font-size="12" font-weight="bold" fill="white">OCEAN ZONES</text>
  <!-- Zone dividers -->
  <line x1="0" y1="82" x2="340" y2="82" stroke="#4fc3f7" stroke-width="1" stroke-dasharray="6,3"/>
  <line x1="0" y1="140" x2="340" y2="140" stroke="#1565c0" stroke-width="1" stroke-dasharray="6,3"/>
  <!-- Sunlit Zone label -->
  <text x="5" y="36" font-size="10" font-weight="bold" fill="white">SUNLIT ZONE</text>
  <!-- Fish silhouettes -->
  <ellipse cx="120" cy="45" rx="18" ry="8" fill="#80deea"/>
  <polygon points="138,45 150,38 150,52" fill="#80deea"/>
  <circle cx="112" cy="43" r="2" fill="#01579b"/>
  <ellipse cx="200" cy="60" rx="14" ry="6" fill="#b2ebf2"/>
  <polygon points="214,60 224,55 224,65" fill="#b2ebf2"/>
  <ellipse cx="80" cy="68" rx="12" ry="5" fill="#80deea"/>
  <polygon points="92,68 100,64 100,72" fill="#80deea"/>
  <!-- Twilight Zone -->
  <text x="5" y="105" font-size="10" font-weight="bold" fill="#90caf9">TWILIGHT ZONE</text>
  <!-- Jellyfish -->
  <ellipse cx="170" cy="110" rx="18" ry="12" fill="#ce93d8" opacity="0.7"/>
  <line x1="158" y1="122" x2="152" y2="138" stroke="#ce93d8" stroke-width="1.5" opacity="0.6"/>
  <line x1="164" y1="122" x2="160" y2="138" stroke="#ce93d8" stroke-width="1.5" opacity="0.6"/>
  <line x1="170" y1="122" x2="170" y2="140" stroke="#ce93d8" stroke-width="1.5" opacity="0.6"/>
  <line x1="176" y1="122" x2="180" y2="138" stroke="#ce93d8" stroke-width="1.5" opacity="0.6"/>
  <line x1="182" y1="122" x2="188" y2="138" stroke="#ce93d8" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="100" cy="118" rx="12" ry="8" fill="#b39ddb" opacity="0.6"/>
  <line x1="96" y1="126" x2="93" y2="136" stroke="#b39ddb" stroke-width="1" opacity="0.5"/>
  <line x1="100" y1="126" x2="100" y2="136" stroke="#b39ddb" stroke-width="1" opacity="0.5"/>
  <line x1="104" y1="126" x2="107" y2="136" stroke="#b39ddb" stroke-width="1" opacity="0.5"/>
  <!-- Midnight Zone -->
  <text x="5" y="162" font-size="10" font-weight="bold" fill="#546e7a">MIDNIGHT ZONE</text>
  <!-- Glowing creature -->
  <ellipse cx="200" cy="175" rx="20" ry="8" fill="#1a3a4a"/>
  <circle cx="184" cy="175" r="2" fill="#00e5ff" opacity="0.9"/>
  <circle cx="192" cy="170" r="1.5" fill="#00e5ff" opacity="0.8"/>
  <circle cx="200" cy="167" r="2" fill="#00e5ff" opacity="0.9"/>
  <circle cx="208" cy="170" r="1.5" fill="#00e5ff" opacity="0.8"/>
  <circle cx="216" cy="175" r="2" fill="#00e5ff" opacity="0.9"/>
  <!-- Depth markers -->
  <text x="295" y="58" text-anchor="end" font-size="9" fill="white">0–200m</text>
  <text x="295" y="112" text-anchor="end" font-size="9" fill="#90caf9">200–1000m</text>
  <text x="295" y="168" text-anchor="end" font-size="9" fill="#546e7a">1000m+</text>
  <line x1="298" y1="54" x2="335" y2="54" stroke="white" stroke-width="0.8"/>
  <line x1="298" y1="108" x2="335" y2="108" stroke="#90caf9" stroke-width="0.8"/>
  <line x1="298" y1="164" x2="335" y2="164" stroke="#546e7a" stroke-width="0.8"/>
</svg>