<svg viewBox="0 0 340 200" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
  <rect width="340" height="200" fill="#e8f4f8"/>
  <!-- sky -->
  <rect width="340" height="110" fill="#d0eaf8"/>
  <!-- mountain -->
  <polygon points="0,110 90,30 180,110" fill="#9e9e9e" stroke="#757575" stroke-width="1.5"/>
  <polygon points="80,110 170,20 260,110" fill="#bdbdbd" stroke="#9e9e9e" stroke-width="1.5"/>
  <!-- snow cap -->
  <polygon points="90,30 110,55 70,55" fill="white"/>
  <polygon points="170,20 195,52 145,52" fill="white"/>
  <!-- glacier body -->
  <path d="M100,55 Q120,70 140,80 Q160,90 180,100 Q200,110 220,115 L220,120 Q200,118 180,107 Q160,96 140,86 Q120,76 100,63 Z" fill="#b3e5fc" stroke="#0288d1" stroke-width="1.5"/>
  <!-- flow arrows -->
  <line x1="130" y1="68" x2="150" y2="82" stroke="#0277bd" stroke-width="2" marker-end="url(#glacArr)"/>
  <line x1="155" y1="83" x2="175" y2="96" stroke="#0277bd" stroke-width="2" marker-end="url(#glacArr)"/>
  <!-- meltwater stream -->
  <path d="M220,118 Q240,125 270,130 Q300,135 330,132" fill="none" stroke="#29b6f6" stroke-width="2.5" stroke-linecap="round"/>
  <!-- ground / valley -->
  <rect x="0" y="110" width="340" height="90" fill="#a5d6a7" opacity="0.6"/>
  <!-- moraine (debris at edge) -->
  <ellipse cx="218" cy="118" rx="12" ry="5" fill="#8d6e63"/>
  <!-- labels -->
  <text x="112" y="65" font-size="9" fill="#01579b" font-weight="bold">GLACIER</text>
  <text x="222" y="116" font-size="8" fill="#5d4037" font-weight="bold">MORAINE</text>
  <text x="240" y="128" font-size="8" fill="#0277bd" font-weight="bold">MELTWATER</text>
  <text x="140" y="82" font-size="8" fill="#01579b" font-weight="bold">FLOW</text>
  <text x="155" y="140" font-size="9" fill="#388e3c" font-weight="bold">valley</text>
  <text x="170" y="193" text-anchor="middle" font-size="11" fill="#01579b" font-weight="bold">Glaciers</text>
  <defs>
    <marker id="glacArr" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto"><polygon points="0 0,6 3,0 6" fill="#0277bd"/></marker>
  </defs>
</svg>
