<svg viewBox="0 0 340 200" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="340" height="200" fill="#0a1628"/>
  <text x="170" y="14" text-anchor="middle" font-size="12" font-weight="bold" fill="white">SOLAR SYSTEM</text>
  <!-- Sun -->
  <circle cx="22" cy="100" r="20" fill="#FFD700"/>
  <text x="22" y="130" text-anchor="middle" font-size="8" fill="#FFD700">SUN</text>
  <!-- Orbital arcs -->
  <path d="M42,100 Q80,55 118,100 Q80,145 42,100" stroke="#ffffff33" stroke-width="0.8" fill="none"/>
  <path d="M42,100 Q100,40 158,100 Q100,160 42,100" stroke="#ffffff33" stroke-width="0.8" fill="none"/>
  <path d="M42,100 Q110,30 178,100 Q110,170 42,100" stroke="#ffffff33" stroke-width="0.8" fill="none"/>
  <path d="M42,100 Q120,20 198,100 Q120,180 42,100" stroke="#ffffff33" stroke-width="0.8" fill="none"/>
  <path d="M42,100 Q150,10 258,100 Q150,190 42,100" stroke="#ffffff33" stroke-width="0.8" fill="none"/>
  <path d="M42,100 Q170,5 298,100 Q170,195 42,100" stroke="#ffffff33" stroke-width="0.8" fill="none"/>
  <path d="M42,100 Q185,5 328,100 Q185,195 42,100" stroke="#ffffff33" stroke-width="0.8" fill="none"/>
  <path d="M42,100 Q190,2 338,100 Q190,198 42,100" stroke="#ffffff33" stroke-width="0.8" fill="none"/>
  <!-- Mercury -->
  <circle cx="80" cy="80" r="3" fill="#9E9E9E"/>
  <text x="80" y="71" text-anchor="middle" font-size="7" fill="#ccc">Mercury</text>
  <!-- Venus -->
  <circle cx="108" cy="68" r="5" fill="#CD853F"/>
  <text x="108" y="59" text-anchor="middle" font-size="7" fill="#ccc">Venus</text>
  <!-- Earth -->
  <circle cx="138" cy="58" r="5.5" fill="#2E8B57"/>
  <text x="138" y="49" text-anchor="middle" font-size="7" fill="#ccc">Earth</text>
  <!-- Mars -->
  <circle cx="168" cy="50" r="4" fill="#CD5C00"/>
  <text x="168" y="41" text-anchor="middle" font-size="7" fill="#ccc">Mars</text>
  <!-- Jupiter -->
  <circle cx="218" cy="40" r="10" fill="#D2B48C"/>
  <line x1="209" y1="38" x2="228" y2="42" stroke="#A0876A" stroke-width="1.5"/>
  <line x1="208" y1="40" x2="228" y2="40" stroke="#A0876A" stroke-width="1"/>
  <text x="218" y="28" text-anchor="middle" font-size="7" fill="#ccc">Jupiter</text>
  <!-- Saturn -->
  <ellipse cx="268" cy="35" rx="16" ry="4" fill="none" stroke="#DAA520" stroke-width="1.5"/>
  <circle cx="268" cy="35" r="8" fill="#FFD700"/>
  <text x="268" y="23" text-anchor="middle" font-size="7" fill="#ccc">Saturn</text>
  <!-- Uranus -->
  <circle cx="308" cy="50" r="6" fill="#7FFFD4"/>
  <text x="308" y="40" text-anchor="middle" font-size="7" fill="#ccc">Uranus</text>
  <!-- Neptune -->
  <circle cx="330" cy="72" r="6" fill="#1E3A8A"/>
  <text x="330" y="62" text-anchor="middle" font-size="7" fill="#ccc">Neptune</text>
</svg>