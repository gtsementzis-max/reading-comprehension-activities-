<svg viewBox="0 0 340 200" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
  <rect width="340" height="200" fill="#fdf3e7"/>
  <!-- three rock nodes -->
  <!-- Igneous top -->
  <ellipse cx="170" cy="28" rx="38" ry="18" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="170" y="25" text-anchor="middle" font-size="9" fill="white" font-weight="bold">IGNEOUS</text>
  <text x="170" y="36" text-anchor="middle" font-size="7" fill="#ffd" >(e.g. granite)</text>
  <!-- Sedimentary bottom-left -->
  <ellipse cx="68" cy="158" rx="42" ry="18" fill="#c8a87a" stroke="#8B6340" stroke-width="2"/>
  <text x="68" y="155" text-anchor="middle" font-size="9" fill="white" font-weight="bold">SEDIMENTARY</text>
  <text x="68" y="166" text-anchor="middle" font-size="7" fill="#ffe" >(e.g. sandstone)</text>
  <!-- Metamorphic bottom-right -->
  <ellipse cx="272" cy="158" rx="42" ry="18" fill="#7f8c8d" stroke="#5d6d7e" stroke-width="2"/>
  <text x="272" y="155" text-anchor="middle" font-size="9" fill="white" font-weight="bold">METAMORPHIC</text>
  <text x="272" y="166" text-anchor="middle" font-size="7" fill="#eef" >(e.g. marble)</text>
  <!-- arrows: igneous → sedimentary (weathering) -->
  <path d="M140,42 Q80,80 95,140" fill="none" stroke="#e67e22" stroke-width="2" marker-end="url(#arr)"/>
  <text x="78" y="97" font-size="8" fill="#884707" font-weight="bold">weathering</text>
  <text x="72" y="107" font-size="8" fill="#884707">& erosion</text>
  <!-- sedimentary → metamorphic (heat & pressure) -->
  <path d="M110,158 L230,158" fill="none" stroke="#9b59b6" stroke-width="2" marker-end="url(#arr)"/>
  <text x="150" y="152" font-size="8" fill="#6c3483" font-weight="bold">heat &amp; pressure</text>
  <!-- metamorphic → igneous (melting) -->
  <path d="M248,143 Q220,80 200,42" fill="none" stroke="#e74c3c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="226" y="97" font-size="8" fill="#c0392b" font-weight="bold">melting</text>
  <!-- igneous → metamorphic short arrow (direct heat) -->
  <path d="M200,38 Q260,80 245,140" fill="none" stroke="#9b59b6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr2)"/>
  <text x="170" y="193" text-anchor="middle" font-size="11" fill="#6d4c41" font-weight="bold">The Rock Cycle</text>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#555"/></marker>
    <marker id="arr2" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto"><polygon points="0 0,6 3,0 6" fill="#9b59b6"/></marker>
  </defs>
</svg>
