<svg viewBox="0 0 340 200" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
  <rect width="340" height="200" fill="#fef9f0"/>
  <!-- Panel 1: Wind erosion -->
  <rect x="5" y="20" width="100" height="80" rx="8" fill="#fde8c8" stroke="#e67e22" stroke-width="1.5"/>
  <text x="55" y="34" text-anchor="middle" font-size="9" fill="#884707" font-weight="bold">WIND</text>
  <!-- rock being worn -->
  <ellipse cx="55" cy="65" rx="28" ry="22" fill="#c8a87a" stroke="#8B6340" stroke-width="1.5"/>
  <ellipse cx="55" cy="63" rx="22" ry="18" fill="#d4b896"/>
  <!-- wind particles -->
  <line x1="10" y1="58" x2="30" y2="56" stroke="#e67e22" stroke-width="2" stroke-linecap="round" marker-end="url(#wArr)"/>
  <line x1="8" y1="66" x2="28" y2="65" stroke="#e67e22" stroke-width="2" stroke-linecap="round" marker-end="url(#wArr)"/>
  <line x1="10" y1="74" x2="30" y2="73" stroke="#e67e22" stroke-width="2" stroke-linecap="round" marker-end="url(#wArr)"/>
  <circle cx="85" cy="52" r="2" fill="#c8a87a"/>
  <circle cx="92" cy="60" r="1.5" fill="#c8a87a"/>
  <circle cx="88" cy="68" r="2" fill="#c8a87a"/>
  <text x="55" y="95" text-anchor="middle" font-size="8" fill="#884707">sand &amp; particles fly away</text>
  <!-- Panel 2: Water erosion -->
  <rect x="120" y="20" width="100" height="80" rx="8" fill="#dff0ff" stroke="#2e86de" stroke-width="1.5"/>
  <text x="170" y="34" text-anchor="middle" font-size="9" fill="#0d4a88" font-weight="bold">WATER</text>
  <!-- river carving through rock -->
  <rect x="128" y="42" width="84" height="38" rx="4" fill="#c8a87a"/>
  <path d="M128,60 Q145,52 162,60 Q179,68 196,60 Q204,56 204,60 L204,80 L128,80 Z" fill="#74b9ff" opacity="0.8"/>
  <text x="170" y="94" text-anchor="middle" font-size="8" fill="#0d4a88">river carves a canyon</text>
  <!-- Panel 3: Coastal erosion -->
  <rect x="235" y="20" width="100" height="80" rx="8" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/>
  <text x="285" y="34" text-anchor="middle" font-size="9" fill="#1a5e3a" font-weight="bold">WAVES</text>
  <!-- cliff -->
  <rect x="265" y="40" width="50" height="50" fill="#c8a87a" stroke="#8B6340" stroke-width="1.5"/>
  <!-- waves -->
  <path d="M240,65 Q250,58 260,65 Q252,70 240,65" fill="#74b9ff"/>
  <path d="M240,74 Q252,67 262,74" fill="none" stroke="#2e86de" stroke-width="1.5"/>
  <!-- chip off cliff -->
  <polygon points="265,55 275,50 275,65 265,60" fill="#a0785a"/>
  <text x="285" y="97" text-anchor="middle" font-size="8" fill="#1a5e3a">waves eat the cliff</text>
  <!-- bottom result -->
  <rect x="5" y="115" width="330" height="40" rx="8" fill="#e8f5e9" stroke="#27ae60" stroke-width="1.5"/>
  <text x="170" y="130" text-anchor="middle" font-size="9" fill="#1a5e3a" font-weight="bold">RESULT OF EROSION</text>
  <text x="170" y="147" text-anchor="middle" font-size="9" fill="#388e3c">Rock breaks down → sediment → carried away by wind or water</text>
  <text x="170" y="193" text-anchor="middle" font-size="11" fill="#8d6e63" font-weight="bold">Weathering &amp; Erosion</text>
  <defs>
    <marker id="wArr" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><polygon points="0 0,5 2.5,0 5" fill="#e67e22"/></marker>
  </defs>
</svg>
