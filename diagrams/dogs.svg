<svg viewBox="0 0 340 200" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="340" height="200" fill="#f9f3e8"/>
  <text x="170" y="14" text-anchor="middle" font-size="12" font-weight="bold" fill="#4e342e">DOG ANATOMY</text>
  <!-- Body -->
  <ellipse cx="160" cy="130" rx="65" ry="32" fill="#a1887f" stroke="#795548" stroke-width="2"/>
  <!-- Head -->
  <circle cx="90" cy="105" r="28" fill="#a1887f" stroke="#795548" stroke-width="2"/>
  <!-- Ear left -->
  <ellipse cx="76" cy="84" rx="10" ry="16" fill="#8d6e63" stroke="#795548" stroke-width="1.5" transform="rotate(-15,76,84)"/>
  <!-- Muzzle -->
  <ellipse cx="68" cy="114" rx="18" ry="12" fill="#bcaaa4" stroke="#795548" stroke-width="1.5"/>
  <!-- Nose -->
  <ellipse cx="62" cy="110" rx="5" ry="3.5" fill="#4e342e"/>
  <!-- Eye -->
  <circle cx="82" cy="100" r="5" fill="#4e342e"/>
  <circle cx="80" cy="98" r="1.5" fill="white"/>
  <!-- Tail -->
  <path d="M222,120 Q250,95 245,75" stroke="#a1887f" stroke-width="10" fill="none" stroke-linecap="round"/>
  <!-- Legs -->
  <rect x="105" y="155" width="16" height="32" rx="6" fill="#8d6e63" stroke="#795548" stroke-width="1.5"/>
  <rect x="130" y="155" width="16" height="32" rx="6" fill="#8d6e63" stroke="#795548" stroke-width="1.5"/>
  <rect x="175" y="155" width="16" height="32" rx="6" fill="#8d6e63" stroke="#795548" stroke-width="1.5"/>
  <rect x="200" y="155" width="16" height="32" rx="6" fill="#8d6e63" stroke="#795548" stroke-width="1.5"/>
  <!-- Paws -->
  <ellipse cx="113" cy="188" rx="11" ry="6" fill="#795548"/>
  <ellipse cx="138" cy="188" rx="11" ry="6" fill="#795548"/>
  <ellipse cx="183" cy="188" rx="11" ry="6" fill="#795548"/>
  <ellipse cx="208" cy="188" rx="11" ry="6" fill="#795548"/>
  <!-- Labels -->
  <line x1="76" y1="84" x2="40" y2="60" stroke="#555" stroke-width="1"/>
  <text x="38" y="56" text-anchor="middle" font-size="9" font-weight="bold" fill="#4e342e">EARS</text>
  <line x1="62" y1="110" x2="30" y2="108" stroke="#555" stroke-width="1"/>
  <text x="18" y="106" text-anchor="end" font-size="9" font-weight="bold" fill="#4e342e">MUZZLE</text>
  <line x1="62" y1="116" x2="30" y2="128" stroke="#555" stroke-width="1"/>
  <text x="18" y="132" text-anchor="end" font-size="9" font-weight="bold" fill="#4e342e">SNOUT</text>
  <line x1="160" y1="120" x2="310" y2="90" stroke="#555" stroke-width="1"/>
  <text x="315" y="88" font-size="9" font-weight="bold" fill="#4e342e">COAT</text>
  <line x1="113" y1="188" x2="113" y2="198" stroke="#555" stroke-width="1"/>
  <text x="113" y="199" text-anchor="middle" font-size="9" font-weight="bold" fill="#4e342e">PAW</text>
  <line x1="245" y1="75" x2="280" y2="60" stroke="#555" stroke-width="1"/>
  <text x="285" y="58" font-size="9" font-weight="bold" fill="#4e342e">TAIL</text>
</svg>