<svg viewBox="0 0 340 200" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
  <rect width="340" height="200" fill="#fdf6ee"/>
  <!-- ground layers -->
  <rect x="0" y="120" width="340" height="80" fill="#c8a87a" opacity="0.4"/>
  <rect x="0" y="145" width="340" height="55" fill="#a0785a" opacity="0.4"/>
  <rect x="0" y="168" width="340" height="32" fill="#7a5535" opacity="0.4"/>
  <!-- fault line -->
  <line x1="170" y1="0" x2="170" y2="200" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6,3"/>
  <text x="174" y="12" font-size="9" fill="#c0392b" font-weight="bold">FAULT LINE</text>
  <!-- hypocenter -->
  <circle cx="170" cy="158" r="8" fill="#e74c3c"/>
  <text x="182" y="162" font-size="8" fill="#7a1a0a" font-weight="bold">FOCUS</text>
  <!-- epicenter on surface -->
  <circle cx="170" cy="118" r="6" fill="#f39c12"/>
  <text x="180" y="122" font-size="8" fill="#884707" font-weight="bold">EPICENTER</text>
  <!-- seismic waves left -->
  <ellipse cx="170" cy="158" rx="25" ry="12" fill="none" stroke="#e74c3c" stroke-width="1.5" opacity="0.8"/>
  <ellipse cx="170" cy="158" rx="45" ry="22" fill="none" stroke="#e74c3c" stroke-width="1.2" opacity="0.6"/>
  <ellipse cx="170" cy="158" rx="65" ry="32" fill="none" stroke="#e74c3c" stroke-width="1" opacity="0.4"/>
  <!-- surface waves -->
  <path d="M100,118 Q115,108 130,118 Q145,128 160,118" fill="none" stroke="#f39c12" stroke-width="2" stroke-linecap="round"/>
  <path d="M180,118 Q195,108 210,118 Q225,128 240,118" fill="none" stroke="#f39c12" stroke-width="2" stroke-linecap="round"/>
  <!-- buildings on surface -->
  <rect x="55" y="96" width="18" height="22" fill="#aab7b8" stroke="#7f8c8d" stroke-width="1.5"/>
  <rect x="60" y="100" width="4" height="4" fill="#dff0ff"/>
  <rect x="66" y="100" width="4" height="4" fill="#dff0ff"/>
  <rect x="60" y="107" width="4" height="4" fill="#dff0ff"/>
  <rect x="66" y="107" width="4" height="4" fill="#dff0ff"/>
  <!-- shaky building right -->
  <rect x="260" y="93" width="18" height="25" fill="#aab7b8" stroke="#7f8c8d" stroke-width="1.5" transform="rotate(-3,269,105)"/>
  <text x="245" y="89" font-size="8" fill="#c0392b" font-weight="bold">shaking!</text>
  <!-- labels -->
  <text x="170" y="193" text-anchor="middle" font-size="11" fill="#7a5535" font-weight="bold">Earthquakes</text>
  <text x="20" y="135" font-size="8" fill="#7a5535">crust</text>
  <text x="20" y="158" font-size="8" fill="#7a5535">mantle</text>
</svg>
