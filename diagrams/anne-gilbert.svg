<svg viewBox="0 0 340 210" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="340" height="210" fill="#dbeeea"/>
  <text x="170" y="14" text-anchor="middle" font-size="11" font-weight="bold" fill="#063a34">CHARACTER ARC — how a character changes</text>

  <!-- axes -->
  <line x1="30" y1="40" x2="30" y2="150" stroke="#0b574f" stroke-width="1.2"/>
  <line x1="30" y1="150" x2="315" y2="150" stroke="#0b574f" stroke-width="1.2"/>
  <text x="26" y="46" text-anchor="end" font-size="7.5" fill="#0b574f">warm</text>
  <text x="26" y="148" text-anchor="end" font-size="7.5" fill="#0b574f">angry</text>
  <text x="315" y="162" text-anchor="end" font-size="7.5" fill="#0b574f">time →</text>

  <!-- Anne's feelings toward Gilbert: low anger rising to friendship -->
  <path d="M42,140 L92,144 L160,116 L235,82 L300,50" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linejoin="round"/>

  <circle cx="42" cy="140" r="8.5" fill="#f2fbf9" stroke="#0f766e" stroke-width="1.8"/>
  <text x="42" y="143" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#0b574f">1</text>
  <circle cx="92" cy="144" r="8.5" fill="#f2fbf9" stroke="#0f766e" stroke-width="1.8"/>
  <text x="92" y="147" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#0b574f">2</text>
  <circle cx="160" cy="116" r="8.5" fill="#f2fbf9" stroke="#0f766e" stroke-width="1.8"/>
  <text x="160" y="119" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#0b574f">3</text>
  <circle cx="235" cy="82" r="8.5" fill="#f2fbf9" stroke="#0f766e" stroke-width="1.8"/>
  <text x="235" y="85" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#0b574f">4</text>
  <circle cx="300" cy="50" r="9.5" fill="#0f766e" stroke="#063a34" stroke-width="1.8"/>
  <text x="300" y="53" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#fff">5</text>

  <!-- key -->
  <text x="16" y="172" font-size="7.6" fill="#26303a"><tspan font-weight="bold">1</tspan> "Carrots!" — Anne smashes her slate in a temper</text>
  <text x="16" y="182" font-size="7.6" fill="#26303a"><tspan font-weight="bold">2</tspan> A years-long grudge — proud Anne won't forgive</text>
  <text x="16" y="192" font-size="7.6" fill="#26303a"><tspan font-weight="bold">3</tspan> Rivalry fuels her ambition to be top of the class</text>
  <text x="16" y="202" font-size="7.6" fill="#26303a"><tspan font-weight="bold">4</tspan> Anne is humbled; Gilbert's gracious sacrifice &#183; <tspan font-weight="bold">5</tspan> friends at last</text>
</svg>
