<svg viewBox="0 0 340 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="340" height="200" fill="#e8f5e0" rx="8"/>
  <text x="170" y="15" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2a4a10" text-anchor="middle">FARM LAYOUT (AERIAL VIEW)</text>
  <!-- Fence (perimeter) -->
  <rect x="18" y="22" width="304" height="170" rx="4" fill="none" stroke="#8a6030" stroke-width="3" stroke-dasharray="8,4"/>
  <!-- Crops field (top-left area) -->
  <rect x="26" y="30" width="130" height="80" rx="3" fill="#a8d460"/>
  <line x1="26" y1="42" x2="156" y2="42" stroke="#80b030" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="26" y1="54" x2="156" y2="54" stroke="#80b030" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="26" y1="66" x2="156" y2="66" stroke="#80b030" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="26" y1="78" x2="156" y2="78" stroke="#80b030" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="26" y1="90" x2="156" y2="90" stroke="#80b030" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="91" y="72" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2a5a00" text-anchor="middle">CROPS FIELD</text>
  <!-- Barn (top-right) -->
  <rect x="175" y="32" width="80" height="55" rx="3" fill="#cc3333" stroke="#882222" stroke-width="2"/>
  <polygon points="175,32 215,20 255,32" fill="#aa2222" stroke="#882222" stroke-width="1.5"/>
  <rect x="200" y="55" width="18" height="32" fill="#222" rx="2"/>
  <text x="215" y="72" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">BARN</text>
  <!-- Farmhouse (right-middle) -->
  <rect x="262" y="32" width="50" height="40" rx="2" fill="#f0d080" stroke="#c0a030" stroke-width="1.5"/>
  <polygon points="262,32 287,18 312,32" fill="#e8b030" stroke="#c0a030" stroke-width="1.5"/>
  <rect x="278" y="50" width="10" height="22" fill="#88aaff" rx="1"/>
  <text x="287" y="82" font-family="sans-serif" font-size="9" font-weight="bold" fill="#5a3000" text-anchor="middle">FARMHOUSE</text>
  <!-- Pasture (bottom area) -->
  <rect x="26" y="120" width="286" height="62" rx="3" fill="#88cc44"/>
  <!-- Animal dots -->
  <circle cx="60" cy="145" r="7" fill="#ffffff" stroke="#aaa" stroke-width="1"/>
  <circle cx="90" cy="155" r="7" fill="#ffffff" stroke="#aaa" stroke-width="1"/>
  <circle cx="130" cy="142" r="7" fill="#ffffff" stroke="#aaa" stroke-width="1"/>
  <circle cx="170" cy="158" r="7" fill="#5a3300" stroke="#333" stroke-width="1"/>
  <circle cx="210" cy="144" r="7" fill="#ffffff" stroke="#aaa" stroke-width="1"/>
  <circle cx="260" cy="152" r="7" fill="#ffffff" stroke="#aaa" stroke-width="1"/>
  <text x="160" y="176" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2a5a00" text-anchor="middle">PASTURE</text>
  <!-- Fence label -->
  <text x="170" y="194" font-family="sans-serif" font-size="9" font-weight="bold" fill="#8a6030" text-anchor="middle">FENCE (perimeter)</text>
</svg>
