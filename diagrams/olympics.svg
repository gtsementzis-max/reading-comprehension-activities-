<svg viewBox="0 0 340 200" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="340" height="200" fill="white"/>
  <text x="170" y="14" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">OLYMPIC GAMES</text>
  <!-- Olympic rings: 3 top (blue, black, red), 2 bottom (yellow, green) -->
  <!-- Top row -->
  <circle cx="88" cy="70" r="28" fill="none" stroke="#0085C7" stroke-width="8"/>
  <circle cx="155" cy="70" r="28" fill="none" stroke="#000000" stroke-width="8"/>
  <circle cx="222" cy="70" r="28" fill="none" stroke="#DF0024" stroke-width="8"/>
  <!-- Bottom row -->
  <circle cx="122" cy="95" r="28" fill="none" stroke="#F4C300" stroke-width="8"/>
  <circle cx="189" cy="95" r="28" fill="none" stroke="#009F6B" stroke-width="8"/>
  <!-- Fix overlaps with white arcs (interlock effect) -->
  <path d="M127,70 A28,28 0 0,1 183,70" stroke="white" stroke-width="8" fill="none"/>
  <path d="M110,83 A28,28 0 0,0 138,83" stroke="#0085C7" stroke-width="8" fill="none"/>
  <path d="M144,83 A28,28 0 0,0 172,83" stroke="#000000" stroke-width="8" fill="none"/>
  <path d="M177,83 A28,28 0 0,0 205,83" stroke="#DF0024" stroke-width="8" fill="none"/>
  <!-- Labels -->
  <text x="88" y="112" text-anchor="middle" font-size="8" font-weight="bold" fill="#0085C7">EUROPE</text>
  <text x="155" y="112" text-anchor="middle" font-size="8" font-weight="bold" fill="#333">ASIA</text>
  <text x="222" y="112" text-anchor="middle" font-size="8" font-weight="bold" fill="#DF0024">AMERICAS</text>
  <text x="122" y="136" text-anchor="middle" font-size="8" font-weight="bold" fill="#e6b800">AFRICA</text>
  <text x="189" y="136" text-anchor="middle" font-size="8" font-weight="bold" fill="#009F6B">OCEANIA</text>
  <!-- Sport icons bottom -->
  <!-- Runner -->
  <circle cx="60" cy="162" r="6" fill="#555"/>
  <line x1="60" y1="168" x2="60" y2="182" stroke="#555" stroke-width="2"/>
  <line x1="60" y1="175" x2="52" y2="185" stroke="#555" stroke-width="2"/>
  <line x1="60" y1="175" x2="68" y2="182" stroke="#555" stroke-width="2"/>
  <line x1="60" y1="168" x2="50" y2="175" stroke="#555" stroke-width="2"/>
  <line x1="60" y1="168" x2="70" y2="172" stroke="#555" stroke-width="2"/>
  <text x="60" y="196" text-anchor="middle" font-size="8" fill="#555">RUNNING</text>
  <!-- Swimmer wave -->
  <path d="M148,170 Q158,162 168,170 Q178,178 188,170" stroke="#0085C7" stroke-width="2.5" fill="none"/>
  <text x="168" y="190" text-anchor="middle" font-size="8" fill="#0085C7">SWIMMING</text>
  <!-- Bicycle -->
  <circle cx="268" cy="175" r="12" fill="none" stroke="#DF0024" stroke-width="2"/>
  <circle cx="292" cy="175" r="12" fill="none" stroke="#DF0024" stroke-width="2"/>
  <line x1="268" y1="175" x2="280" y2="163" stroke="#555" stroke-width="1.5"/>
  <line x1="292" y1="175" x2="280" y2="163" stroke="#555" stroke-width="1.5"/>
  <line x1="280" y1="163" x2="280" y2="175" stroke="#555" stroke-width="1.5"/>
  <text x="280" y="196" text-anchor="middle" font-size="8" fill="#DF0024">CYCLING</text>
</svg>