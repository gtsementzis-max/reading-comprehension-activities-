<svg viewBox="0 0 340 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="340" height="200" fill="#f5ede0" rx="8"/>
  <text x="170" y="16" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4a2e0a" text-anchor="middle">DINOSAUR TIMELINE</text>
  <!-- Timeline bar -->
  <rect x="20" y="105" width="300" height="14" rx="5" fill="#c8a87a" stroke="#9a7040" stroke-width="1.5"/>
  <!-- Era segments -->
  <rect x="20" y="105" width="90" height="14" rx="5" fill="#c87844" stroke="#9a5020" stroke-width="1"/>
  <rect x="115" y="105" width="100" height="14" rx="5" fill="#78a844" stroke="#507020" stroke-width="1"/>
  <rect x="220" y="105" width="100" height="14" rx="5" fill="#e07030" stroke="#a04010" stroke-width="1"/>
  <!-- Date markers -->
  <line x1="20" y1="118" x2="20" y2="130" stroke="#554" stroke-width="1.5"/>
  <text x="20" y="142" font-family="sans-serif" font-size="9" fill="#443" text-anchor="middle">250 mya</text>
  <line x1="110" y1="118" x2="110" y2="130" stroke="#554" stroke-width="1.5"/>
  <text x="110" y="142" font-family="sans-serif" font-size="9" fill="#443" text-anchor="middle">200 mya</text>
  <line x1="215" y1="118" x2="215" y2="130" stroke="#554" stroke-width="1.5"/>
  <text x="215" y="142" font-family="sans-serif" font-size="9" fill="#443" text-anchor="middle">145 mya</text>
  <line x1="320" y1="118" x2="320" y2="130" stroke="#554" stroke-width="1.5"/>
  <text x="320" y="142" font-family="sans-serif" font-size="9" fill="#443" text-anchor="middle">66 mya</text>
  <!-- Era labels -->
  <text x="65" y="100" font-family="sans-serif" font-size="10" font-weight="bold" fill="#7a2200" text-anchor="middle">TRIASSIC</text>
  <text x="165" y="100" font-family="sans-serif" font-size="10" font-weight="bold" fill="#336600" text-anchor="middle">JURASSIC</text>
  <text x="270" y="100" font-family="sans-serif" font-size="10" font-weight="bold" fill="#883300" text-anchor="middle">CRETACEOUS</text>
  <!-- Small dino silhouette (bipedal) at Triassic -->
  <ellipse cx="65" cy="65" rx="9" ry="7" fill="#9a6633"/>
  <circle cx="70" cy="57" r="5" fill="#9a6633"/>
  <line x1="60" y1="70" x2="57" y2="82" stroke="#9a6633" stroke-width="2.5"/>
  <line x1="67" y1="72" x2="64" y2="82" stroke="#9a6633" stroke-width="2.5"/>
  <line x1="63" y1="65" x2="52" y2="60" stroke="#9a6633" stroke-width="2"/>
  <line x1="56" y1="82" x2="53" y2="87" stroke="#9a6633" stroke-width="2"/>
  <line x1="64" y1="82" x2="60" y2="87" stroke="#9a6633" stroke-width="2"/>
  <!-- Long-neck sauropod at Jurassic -->
  <ellipse cx="165" cy="72" rx="18" ry="11" fill="#5a8833"/>
  <path d="M 155,66 Q 148,48 152,38" fill="none" stroke="#5a8833" stroke-width="6" stroke-linecap="round"/>
  <circle cx="153" cy="35" r="6" fill="#5a8833"/>
  <line x1="155" y1="83" x2="151" y2="95" stroke="#5a8833" stroke-width="3.5"/>
  <line x1="162" y1="83" x2="158" y2="95" stroke="#5a8833" stroke-width="3.5"/>
  <line x1="170" y1="83" x2="174" y2="95" stroke="#5a8833" stroke-width="3.5"/>
  <line x1="177" y1="83" x2="181" y2="95" stroke="#5a8833" stroke-width="3.5"/>
  <path d="M 182,72 Q 196,68 200,72" fill="none" stroke="#5a8833" stroke-width="5" stroke-linecap="round"/>
  <!-- T-Rex at Cretaceous -->
  <ellipse cx="270" cy="68" rx="14" ry="10" fill="#cc5522"/>
  <circle cx="280" cy="59" r="7" fill="#cc5522"/>
  <line x1="260" y1="75" x2="255" y2="90" stroke="#cc5522" stroke-width="3.5"/>
  <line x1="268" y1="77" x2="263" y2="90" stroke="#cc5522" stroke-width="3.5"/>
  <line x1="263" y1="65" x2="254" y2="60" stroke="#cc5522" stroke-width="2"/>
  <line x1="266" y1="62" x2="258" y2="55" stroke="#cc5522" stroke-width="2"/>
  <path d="M 280,67 Q 292,62 295,68" fill="none" stroke="#cc5522" stroke-width="4" stroke-linecap="round"/>
  <line x1="255" y1="90" x2="252" y2="97" stroke="#cc5522" stroke-width="2.5"/>
  <line x1="263" y1="90" x2="259" y2="97" stroke="#cc5522" stroke-width="2.5"/>
  <!-- Mass extinction marker -->
  <text x="170" y="165" font-family="sans-serif" font-size="9" font-weight="bold" fill="#880000" text-anchor="middle">MASS EXTINCTION EVENT ~ 66 million years ago</text>
</svg>
