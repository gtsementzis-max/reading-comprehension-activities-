<svg viewBox="0 0 340 200" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="340" height="200" fill="#d0eaf8"/>
  <text x="170" y="14" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">SHARK ANATOMY</text>
  <!-- Shark body - torpedo shape -->
  <path d="M30,105 Q60,75 130,85 Q200,90 280,100 Q300,103 310,105 Q300,107 280,108 Q200,115 130,110 Q60,118 30,105Z" fill="#78909c" stroke="#546e7a" stroke-width="2"/>
  <!-- Jaw/mouth -->
  <path d="M30,105 Q22,95 20,105 Q22,115 30,105" fill="#bcaaa4" stroke="#546e7a" stroke-width="1.5"/>
  <!-- Teeth -->
  <polygon points="22,101 26,97 26,105" fill="white"/>
  <polygon points="26,99 30,96 30,103" fill="white"/>
  <polygon points="22,109 26,113 26,105" fill="white"/>
  <polygon points="26,111 30,114 30,107" fill="white"/>
  <!-- Dorsal fin -->
  <path d="M155,85 Q165,50 175,85" fill="#607d8b" stroke="#546e7a" stroke-width="1.5"/>
  <!-- Pectoral fin -->
  <path d="M120,108 Q110,128 95,138 Q115,120 130,110Z" fill="#607d8b" stroke="#546e7a" stroke-width="1.5"/>
  <!-- Caudal fin/tail -->
  <path d="M305,105 Q325,80 335,90 Q315,105 335,120 Q325,128 305,105Z" fill="#607d8b" stroke="#546e7a" stroke-width="1.5"/>
  <!-- Gills -->
  <path d="M70,90 Q66,105 70,118" stroke="#455a64" stroke-width="2" fill="none"/>
  <path d="M78,88 Q74,103 78,117" stroke="#455a64" stroke-width="2" fill="none"/>
  <path d="M86,87 Q82,102 86,116" stroke="#455a64" stroke-width="2" fill="none"/>
  <!-- Eye -->
  <circle cx="38" cy="100" r="5" fill="#1a1a1a"/>
  <circle cx="37" cy="99" r="1.5" fill="white"/>
  <!-- Labels -->
  <line x1="165" y1="62" x2="165" y2="48" stroke="#0d47a1" stroke-width="1"/>
  <text x="165" y="44" text-anchor="middle" font-size="9" font-weight="bold" fill="#0d47a1">DORSAL FIN</text>
  <line x1="95" y1="138" x2="80" y2="158" stroke="#0d47a1" stroke-width="1"/>
  <text x="72" y="172" text-anchor="middle" font-size="9" font-weight="bold" fill="#0d47a1">PECTORAL FIN</text>
  <line x1="330" y1="95" x2="338" y2="80" stroke="#0d47a1" stroke-width="1"/>
  <text x="338" y="76" text-anchor="end" font-size="9" font-weight="bold" fill="#0d47a1">CAUDAL FIN</text>
  <line x1="78" y1="90" x2="78" y2="72" stroke="#0d47a1" stroke-width="1"/>
  <text x="78" y="68" text-anchor="middle" font-size="9" font-weight="bold" fill="#0d47a1">GILLS</text>
  <line x1="24" y1="103" x2="8" y2="88" stroke="#0d47a1" stroke-width="1"/>
  <text x="5" y="84" text-anchor="middle" font-size="9" font-weight="bold" fill="#0d47a1">JAW</text>
</svg>