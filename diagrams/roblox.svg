<svg viewBox="0 0 340 200" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="340" height="200" fill="#e8f0ff"/>
  <text x="170" y="14" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a237e">ROBLOX GAME INTERFACE</text>
  <!-- Game screen frame -->
  <rect x="20" y="22" width="300" height="168" rx="10" fill="#2d3a6b" stroke="#1a237e" stroke-width="3"/>
  <!-- Game world background -->
  <rect x="26" y="28" width="288" height="132" rx="6" fill="#4a9e6b"/>
  <!-- Sky -->
  <rect x="26" y="28" width="288" height="55" rx="6" fill="#87ceeb"/>
  <!-- Ground -->
  <rect x="26" y="108" width="288" height="52" rx="2" fill="#5d8a3c"/>
  <!-- Cloud -->
  <ellipse cx="80" cy="45" rx="22" ry="10" fill="white" opacity="0.9"/>
  <ellipse cx="65" cy="50" rx="14" ry="9" fill="white" opacity="0.9"/>
  <ellipse cx="95" cy="50" rx="14" ry="9" fill="white" opacity="0.9"/>
  <!-- Sun -->
  <circle cx="280" cy="45" r="14" fill="#FFD700"/>
  <!-- Blocky avatar center -->
  <!-- Head (square) -->
  <rect x="152" y="55" width="36" height="36" rx="3" fill="#ffcc99" stroke="#e6a87a" stroke-width="1.5"/>
  <!-- Face -->
  <circle cx="163" cy="70" r="3" fill="#333"/>
  <circle cx="175" cy="70" r="3" fill="#333"/>
  <path d="M162,80 Q170,86 178,80" stroke="#333" stroke-width="1.5" fill="none"/>
  <!-- Body (rectangle) -->
  <rect x="148" y="91" width="44" height="38" rx="2" fill="#3f51b5" stroke="#1a237e" stroke-width="1.5"/>
  <!-- Left arm -->
  <rect x="130" y="91" width="16" height="30" rx="3" fill="#3f51b5" stroke="#1a237e" stroke-width="1.5"/>
  <!-- Right arm -->
  <rect x="194" y="91" width="16" height="30" rx="3" fill="#3f51b5" stroke="#1a237e" stroke-width="1.5"/>
  <!-- Left leg -->
  <rect x="150" y="129" width="16" height="28" rx="3" fill="#1a237e" stroke="#0d1659" stroke-width="1.5"/>
  <!-- Right leg -->
  <rect x="174" y="129" width="16" height="28" rx="3" fill="#1a237e" stroke="#0d1659" stroke-width="1.5"/>
  <!-- AVATAR label -->
  <line x1="170" y1="55" x2="170" y2="38" stroke="white" stroke-width="1"/>
  <text x="170" y="35" text-anchor="middle" font-size="9" font-weight="bold" fill="white">AVATAR</text>
  <!-- GAME WORLD label -->
  <text x="60" y="100" text-anchor="middle" font-size="9" font-weight="bold" fill="white">GAME WORLD</text>
  <!-- Menu top-right -->
  <rect x="284" y="30" width="28" height="6" rx="2" fill="#e53935" opacity="0.9"/>
  <rect x="284" y="40" width="22" height="6" rx="2" fill="#e53935" opacity="0.9"/>
  <rect x="284" y="50" width="26" height="6" rx="2" fill="#e53935" opacity="0.9"/>
  <text x="298" y="68" text-anchor="middle" font-size="7.5" font-weight="bold" fill="white">MENU</text>
  <!-- Chat bar bottom of screen frame -->
  <rect x="26" y="152" width="288" height="22" rx="4" fill="#1a1a2e" opacity="0.9"/>
  <rect x="30" y="155" width="180" height="16" rx="3" fill="#2d3a6b"/>
  <text x="120" y="167" text-anchor="middle" font-size="8" fill="#aaa">Type message here...</text>
  <text x="280" y="167" text-anchor="middle" font-size="8" font-weight="bold" fill="#e53935">SEND</text>
  <text x="170" y="186" text-anchor="middle" font-size="9" font-weight="bold" fill="white">CHAT BAR</text>
</svg>