<svg viewBox="0 0 340 200" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="340" height="200" fill="#fff8f0"/>
  <text x="170" y="14" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a1a00">CELEBRATIONS AROUND THE WORLD</text>
  <!-- Rough world map blobs -->
  <!-- Americas (left blob) -->
  <path d="M20,60 Q25,40 45,38 Q65,36 80,50 Q90,65 85,90 Q80,120 70,140 Q55,155 40,145 Q20,130 18,110 Q15,85 20,60Z" fill="#c5e0b4" stroke="#5d8a3c" stroke-width="1.5"/>
  <text x="52" y="95" text-anchor="middle" font-size="7" fill="#1b5e20" font-weight="bold">Americas</text>
  <!-- Eurasia blob -->
  <path d="M110,45 Q140,30 200,32 Q240,34 270,45 Q295,58 300,80 Q305,105 290,125 Q270,145 240,148 Q200,152 170,140 Q140,128 120,110 Q100,88 105,65 Q107,52 110,45Z" fill="#b3d9ff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="210" y="88" text-anchor="middle" font-size="7" fill="#0d47a1" font-weight="bold">Eurasia</text>
  <!-- Africa blob -->
  <path d="M150,130 Q160,118 180,120 Q200,122 210,135 Q215,155 205,168 Q190,180 170,178 Q150,175 145,158 Q140,142 150,130Z" fill="#ffe0b2" stroke="#e65100" stroke-width="1.5"/>
  <text x="178" y="152" text-anchor="middle" font-size="7" fill="#bf360c" font-weight="bold">Africa</text>
  <!-- Star dots & labels -->
  <!-- Carnival Brazil -->
  <circle cx="55" cy="118" r="4" fill="#e53935"/>
  <text x="58" y="113" font-size="8" font-weight="bold" fill="#b71c1c">CARNIVAL</text>
  <text x="58" y="123" font-size="7" fill="#b71c1c">Brazil</text>
  <!-- Diwali India -->
  <circle cx="248" cy="95" r="4" fill="#ff9800"/>
  <text x="252" y="90" font-size="8" font-weight="bold" fill="#e65100">DIWALI</text>
  <text x="252" y="100" font-size="7" fill="#e65100">India</text>
  <!-- Eid Middle East -->
  <circle cx="215" cy="70" r="4" fill="#4caf50"/>
  <text x="219" y="65" font-size="8" font-weight="bold" fill="#1b5e20">EID</text>
  <text x="219" y="75" font-size="7" fill="#1b5e20">Middle East</text>
  <!-- Lunar New Year China -->
  <circle cx="268" cy="65" r="4" fill="#f44336"/>
  <text x="272" y="60" font-size="8" font-weight="bold" fill="#b71c1c">LUNAR</text>
  <text x="272" y="70" font-size="7" fill="#b71c1c">NEW YEAR</text>
  <!-- Christmas Europe -->
  <circle cx="155" cy="60" r="4" fill="#1565c0"/>
  <text x="158" y="55" font-size="8" font-weight="bold" fill="#0d47a1">CHRISTMAS</text>
  <text x="158" y="65" font-size="7" fill="#0d47a1">Europe</text>
</svg>