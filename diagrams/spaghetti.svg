<svg viewBox="0 0 340 200" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="340" height="200" fill="#fdf5e0"/>
  <text x="170" y="14" text-anchor="middle" font-size="12" font-weight="bold" fill="#5d4000">FARM TO TABLE: SPAGHETTI</text>
  <!-- Box 1: Wheat Farm -->
  <rect x="5" y="55" width="68" height="80" rx="6" fill="#fff9e6" stroke="#c8a000" stroke-width="2"/>
  <text x="39" y="71" text-anchor="middle" font-size="8" font-weight="bold" fill="#5d4000">WHEAT</text>
  <text x="39" y="82" text-anchor="middle" font-size="8" font-weight="bold" fill="#5d4000">FARM</text>
  <!-- Wheat stalks -->
  <line x1="27" y1="120" x2="27" y2="90" stroke="#c8a000" stroke-width="2"/>
  <line x1="24" y1="92" x2="27" y2="88" stroke="#c8a000" stroke-width="1.5"/>
  <line x1="30" y1="92" x2="27" y2="88" stroke="#c8a000" stroke-width="1.5"/>
  <line x1="24" y1="96" x2="27" y2="92" stroke="#c8a000" stroke-width="1.5"/>
  <line x1="30" y1="96" x2="27" y2="92" stroke="#c8a000" stroke-width="1.5"/>
  <line x1="39" y1="120" x2="39" y2="88" stroke="#c8a000" stroke-width="2"/>
  <line x1="36" y1="90" x2="39" y2="86" stroke="#c8a000" stroke-width="1.5"/>
  <line x1="42" y1="90" x2="39" y2="86" stroke="#c8a000" stroke-width="1.5"/>
  <line x1="36" y1="94" x2="39" y2="90" stroke="#c8a000" stroke-width="1.5"/>
  <line x1="42" y1="94" x2="39" y2="90" stroke="#c8a000" stroke-width="1.5"/>
  <line x1="51" y1="120" x2="51" y2="90" stroke="#c8a000" stroke-width="2"/>
  <line x1="48" y1="92" x2="51" y2="88" stroke="#c8a000" stroke-width="1.5"/>
  <line x1="54" y1="92" x2="51" y2="88" stroke="#c8a000" stroke-width="1.5"/>
  <line x1="48" y1="96" x2="51" y2="92" stroke="#c8a000" stroke-width="1.5"/>
  <line x1="54" y1="96" x2="51" y2="92" stroke="#c8a000" stroke-width="1.5"/>
  <!-- Arrow 1 -->
  <line x1="75" y1="95" x2="90" y2="95" stroke="#5d4000" stroke-width="2"/>
  <polygon points="90,90 102,95 90,100" fill="#5d4000"/>
  <!-- Box 2: Mill -->
  <rect x="92" y="55" width="68" height="80" rx="6" fill="#fff9e6" stroke="#c8a000" stroke-width="2"/>
  <text x="126" y="71" text-anchor="middle" font-size="8" font-weight="bold" fill="#5d4000">MILL</text>
  <!-- Mill wheel icon -->
  <circle cx="126" cy="105" r="20" fill="none" stroke="#8b6914" stroke-width="2"/>
  <line x1="126" y1="85" x2="126" y2="125" stroke="#8b6914" stroke-width="2"/>
  <line x1="106" y1="105" x2="146" y2="105" stroke="#8b6914" stroke-width="2"/>
  <line x1="112" y1="91" x2="140" y2="119" stroke="#8b6914" stroke-width="1.5"/>
  <line x1="140" y1="91" x2="112" y2="119" stroke="#8b6914" stroke-width="1.5"/>
  <circle cx="126" cy="105" r="5" fill="#8b6914"/>
  <!-- Arrow 2 -->
  <line x1="162" y1="95" x2="177" y2="95" stroke="#5d4000" stroke-width="2"/>
  <polygon points="177,90 189,95 177,100" fill="#5d4000"/>
  <!-- Box 3: Factory -->
  <rect x="179" y="55" width="68" height="80" rx="6" fill="#fff9e6" stroke="#c8a000" stroke-width="2"/>
  <text x="213" y="66" text-anchor="middle" font-size="8" font-weight="bold" fill="#5d4000">PASTA</text>
  <text x="213" y="77" text-anchor="middle" font-size="8" font-weight="bold" fill="#5d4000">FACTORY</text>
  <!-- Building -->
  <rect x="196" y="88" width="34" height="38" fill="#d7ccc8" stroke="#795548" stroke-width="1.5"/>
  <rect x="206" y="78" width="14" height="12" fill="#bcaaa4" stroke="#795548" stroke-width="1"/>
  <rect x="204" y="104" width="8" height="22" fill="#795548"/>
  <rect x="216" y="100" width="10" height="10" fill="#80deea" stroke="#795548" stroke-width="1"/>
  <line x1="210" y1="78" x2="210" y2="60" stroke="#795548" stroke-width="2"/>
  <!-- Arrow 3 -->
  <line x1="249" y1="95" x2="264" y2="95" stroke="#5d4000" stroke-width="2"/>
  <polygon points="264,90 276,95 264,100" fill="#5d4000"/>
  <!-- Box 4: Plate -->
  <rect x="266" y="55" width="68" height="80" rx="6" fill="#fff9e6" stroke="#c8a000" stroke-width="2"/>
  <text x="300" y="71" text-anchor="middle" font-size="8" font-weight="bold" fill="#5d4000">PLATE</text>
  <!-- Plate circle -->
  <circle cx="300" cy="105" r="22" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="2"/>
  <!-- Spaghetti wavy lines -->
  <path d="M284,98 Q290,92 296,98 Q302,104 308,98 Q314,92 320,98" stroke="#c8a000" stroke-width="2" fill="none"/>
  <path d="M284,104 Q290,98 296,104 Q302,110 308,104 Q314,98 320,104" stroke="#e57373" stroke-width="2" fill="none"/>
  <path d="M284,110 Q290,104 296,110 Q302,116 308,110 Q314,104 320,110" stroke="#c8a000" stroke-width="2" fill="none"/>
  <text x="170" y="155" text-anchor="middle" font-size="9" fill="#8b6914">Field → Ground flour → Shaped pasta → Dinner!</text>
</svg>