<svg viewBox="0 0 340 200" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
  <rect width="340" height="200" fill="#e0f4ff"/>
  <!-- water waves hint -->
  <path d="M0,30 Q40,22 80,30 Q120,38 160,30 Q200,22 240,30 Q280,38 320,30 L340,30 L340,0 L0,0 Z" fill="#74b9ff" opacity="0.3"/>
  <!-- shell (carapace) -->
  <ellipse cx="170" cy="110" rx="80" ry="60" fill="#388e3c" stroke="#1b5e20" stroke-width="2.5"/>
  <!-- shell pattern (scutes) -->
  <ellipse cx="170" cy="108" rx="52" ry="38" fill="none" stroke="#2e7d32" stroke-width="1.5"/>
  <line x1="130" y1="78" x2="118" y2="148" stroke="#2e7d32" stroke-width="1.2"/>
  <line x1="150" y1="70" x2="148" y2="148" stroke="#2e7d32" stroke-width="1.2"/>
  <line x1="170" y1="68" x2="170" y2="148" stroke="#2e7d32" stroke-width="1.2"/>
  <line x1="190" y1="70" x2="192" y2="148" stroke="#2e7d32" stroke-width="1.2"/>
  <line x1="210" y1="78" x2="222" y2="148" stroke="#2e7d32" stroke-width="1.2"/>
  <!-- head -->
  <ellipse cx="170" cy="48" rx="26" ry="22" fill="#558b2f" stroke="#33691e" stroke-width="2"/>
  <!-- eyes -->
  <circle cx="158" cy="42" r="5" fill="#1a1a2e"/>
  <circle cx="156" cy="40" r="2" fill="white"/>
  <circle cx="182" cy="42" r="5" fill="#1a1a2e"/>
  <circle cx="180" cy="40" r="2" fill="white"/>
  <!-- mouth -->
  <path d="M160,56 Q170,62 180,56" fill="none" stroke="#33691e" stroke-width="2"/>
  <!-- front flippers -->
  <ellipse cx="88" cy="105" rx="35" ry="12" fill="#558b2f" stroke="#33691e" stroke-width="1.5" transform="rotate(-25,88,105)"/>
  <ellipse cx="252" cy="105" rx="35" ry="12" fill="#558b2f" stroke="#33691e" stroke-width="1.5" transform="rotate(25,252,105)"/>
  <!-- rear flippers -->
  <ellipse cx="122" cy="162" rx="22" ry="9" fill="#558b2f" stroke="#33691e" stroke-width="1.5" transform="rotate(20,122,162)"/>
  <ellipse cx="218" cy="162" rx="22" ry="9" fill="#558b2f" stroke="#33691e" stroke-width="1.5" transform="rotate(-20,218,162)"/>
  <!-- labels -->
  <text x="45" y="82" font-size="9" fill="#1b5e20" font-weight="bold">FLIPPER</text>
  <line x1="72" y1="86" x2="84" y2="96" stroke="#1b5e20" stroke-width="1"/>
  <text x="175" y="18" font-size="9" fill="#1b5e20" font-weight="bold">HEAD</text>
  <line x1="180" y1="20" x2="176" y2="30" stroke="#1b5e20" stroke-width="1"/>
  <text x="232" y="75" font-size="9" fill="#1b5e20" font-weight="bold">CARAPACE</text>
  <line x1="238" y1="78" x2="232" y2="90" stroke="#1b5e20" stroke-width="1"/>
  <text x="220" y="185" font-size="9" fill="#1b5e20" font-weight="bold">SCALES</text>
  <line x1="226" y1="180" x2="218" y2="170" stroke="#1b5e20" stroke-width="1"/>
  <text x="170" y="197" text-anchor="middle" font-size="11" fill="#1b5e20" font-weight="bold">Sea Turtle</text>
</svg>
