<svg viewBox="0 0 340 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="340" height="200" fill="#ffe8ef" rx="8"/>
  <text x="170" y="16" font-family="sans-serif" font-size="12" font-weight="bold" fill="#5a001a" text-anchor="middle">TYPES OF TEETH</text>
  <!-- Gum arch -->
  <path d="M 20,130 Q 105,50 190,130" fill="#f09090" stroke="#c06070" stroke-width="2"/>
  <!-- INCISORS (4 front) -->
  <rect x="78" y="75" width="14" height="24" rx="3" fill="#fffcf0" stroke="#ccbbaa" stroke-width="1.5"/>
  <rect x="94" y="73" width="16" height="26" rx="3" fill="#fffcf0" stroke="#ccbbaa" stroke-width="1.5"/>
  <rect x="112" y="73" width="16" height="26" rx="3" fill="#fffcf0" stroke="#ccbbaa" stroke-width="1.5"/>
  <rect x="130" y="75" width="14" height="24" rx="3" fill="#fffcf0" stroke="#ccbbaa" stroke-width="1.5"/>
  <!-- CANINES -->
  <path d="M 66,80 L 74,80 L 74,90 L 70,102 L 66,90 Z" fill="#fffcf0" stroke="#ccbbaa" stroke-width="1.5"/>
  <path d="M 148,80 L 156,80 L 156,90 L 152,102 L 148,90 Z" fill="#fffcf0" stroke="#ccbbaa" stroke-width="1.5"/>
  <!-- PREMOLARS -->
  <rect x="46" y="84" width="17" height="22" rx="3" fill="#fffcf0" stroke="#ccbbaa" stroke-width="1.5"/>
  <line x1="54" y1="84" x2="54" y2="90" stroke="#ccbbaa" stroke-width="1"/>
  <rect x="159" y="84" width="17" height="22" rx="3" fill="#fffcf0" stroke="#ccbbaa" stroke-width="1.5"/>
  <line x1="167" y1="84" x2="167" y2="90" stroke="#ccbbaa" stroke-width="1"/>
  <!-- MOLARS -->
  <rect x="26" y="90" width="18" height="22" rx="3" fill="#fffcf0" stroke="#ccbbaa" stroke-width="1.5"/>
  <line x1="35" y1="90" x2="35" y2="96" stroke="#ccbbaa" stroke-width="1"/>
  <rect x="178" y="90" width="18" height="22" rx="3" fill="#fffcf0" stroke="#ccbbaa" stroke-width="1.5"/>
  <line x1="187" y1="90" x2="187" y2="96" stroke="#ccbbaa" stroke-width="1"/>
  <!-- Labels for jaw -->
  <text x="105" y="62" font-family="sans-serif" font-size="9" font-weight="bold" fill="#881133" text-anchor="middle">INCISORS (cutting)</text>
  <text x="35" y="75" font-family="sans-serif" font-size="9" font-weight="bold" fill="#881133" text-anchor="end">CANINE</text>
  <line x1="37" y1="74" x2="66" y2="88" stroke="#cc6688" stroke-width="1"/>
  <text x="174" y="75" font-family="sans-serif" font-size="9" font-weight="bold" fill="#881133">CANINE</text>
  <line x1="173" y1="74" x2="156" y2="88" stroke="#cc6688" stroke-width="1"/>
  <text x="18" y="120" font-family="sans-serif" font-size="9" font-weight="bold" fill="#881133" text-anchor="end">MOLARS</text>
  <text x="204" y="120" font-family="sans-serif" font-size="9" font-weight="bold" fill="#881133">MOLARS</text>
  <text x="105" y="145" font-family="sans-serif" font-size="9" font-weight="bold" fill="#881133" text-anchor="middle">PREMOLARS (each side)</text>
  <!-- Tooth cross-section inset -->
  <rect x="220" y="28" width="108" height="160" rx="6" fill="#fff8fc" stroke="#ccaabb" stroke-width="1.5"/>
  <text x="274" y="42" font-family="sans-serif" font-size="9" font-weight="bold" fill="#5a001a" text-anchor="middle">TOOTH CROSS-SECTION</text>
  <!-- Tooth shape -->
  <path d="M 254,55 Q 254,48 274,46 Q 294,48 294,55 L 296,120 Q 296,130 274,135 Q 252,130 252,120 Z" fill="#fffcf0" stroke="#ccbbaa" stroke-width="2"/>
  <!-- ENAMEL layer -->
  <path d="M 256,58 Q 256,52 274,50 Q 292,52 292,58 L 289,80 Q 274,85 259,80 Z" fill="#e0f0e0" stroke="#88cc88" stroke-width="1" opacity="0.8"/>
  <!-- DENTINE -->
  <path d="M 259,80 Q 274,85 289,80 L 290,112 Q 290,118 274,122 Q 258,118 258,112 Z" fill="#f8e8c0" stroke="#c0a040" stroke-width="1" opacity="0.8"/>
  <!-- PULP -->
  <ellipse cx="274" cy="105" rx="10" ry="16" fill="#ffaaaa" stroke="#cc5555" stroke-width="1"/>
  <!-- ROOT -->
  <path d="M 263,125 Q 274,135 285,125 L 288,168 Q 274,175 260,168 Z" fill="#f0d8a0" stroke="#c0a030" stroke-width="1"/>
  <!-- Labels for cross-section -->
  <text x="224" y="58" font-family="sans-serif" font-size="8" font-weight="bold" fill="#1a4a1a" text-anchor="end">CROWN</text>
  <line x1="225" y1="57" x2="255" y2="58" stroke="#aaa" stroke-width="1"/>
  <text x="224" y="72" font-family="sans-serif" font-size="8" font-weight="bold" fill="#1a4a1a" text-anchor="end">ENAMEL</text>
  <line x1="225" y1="71" x2="258" y2="73" stroke="#aaa" stroke-width="1"/>
  <text x="224" y="105" font-family="sans-serif" font-size="8" font-weight="bold" fill="#5a3a00" text-anchor="end">DENTINE</text>
  <line x1="225" y1="104" x2="260" y2="102" stroke="#aaa" stroke-width="1"/>
  <text x="224" y="118" font-family="sans-serif" font-size="8" font-weight="bold" fill="#aa2222" text-anchor="end">PULP</text>
  <line x1="225" y1="117" x2="265" y2="108" stroke="#aaa" stroke-width="1"/>
  <text x="224" y="155" font-family="sans-serif" font-size="8" font-weight="bold" fill="#7a5a00" text-anchor="end">ROOT</text>
  <line x1="225" y1="154" x2="262" y2="148" stroke="#aaa" stroke-width="1"/>
</svg>
