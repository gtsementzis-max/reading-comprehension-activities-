<svg viewBox="0 0 340 200" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="340" height="200" fill="#f5e8da"/>
  <text x="170" y="14" text-anchor="middle" font-size="12" font-weight="bold" fill="#5d2a00">VOLCANO CROSS-SECTION</text>
  <!-- Ground base -->
  <rect x="0" y="175" width="340" height="25" fill="#8B6914"/>
  <!-- Volcano mountain outline -->
  <polygon points="170,30 60,175 280,175" fill="#9E8070" stroke="#7a5a40" stroke-width="2"/>
  <!-- Magma chamber -->
  <ellipse cx="170" cy="160" rx="55" ry="22" fill="#e74c3c" stroke="#c0392b" stroke-width="1.5"/>
  <text x="170" y="163" text-anchor="middle" font-size="9" font-weight="bold" fill="white">MAGMA CHAMBER</text>
  <!-- Vent -->
  <rect x="158" y="50" width="24" height="108" fill="#e67e22" stroke="#d35400" stroke-width="1"/>
  <text x="196" y="108" font-size="9" font-weight="bold" fill="#5d2a00">VENT</text>
  <line x1="186" y1="105" x2="194" y2="105" stroke="#5d2a00" stroke-width="1"/>
  <!-- Crater -->
  <ellipse cx="170" cy="50" rx="28" ry="10" fill="#555" stroke="#333" stroke-width="1.5"/>
  <text x="170" y="44" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">CRATER</text>
  <!-- Ash cloud -->
  <ellipse cx="170" cy="22" rx="30" ry="12" fill="#aaa" opacity="0.85"/>
  <ellipse cx="148" cy="26" rx="16" ry="10" fill="#bbb" opacity="0.85"/>
  <ellipse cx="192" cy="24" rx="16" ry="10" fill="#bbb" opacity="0.85"/>
  <text x="228" y="20" font-size="9" font-weight="bold" fill="#555">ASH CLOUD</text>
  <!-- Lava flows -->
  <path d="M145,80 Q115,100 95,120 Q80,140 85,175" stroke="#e74c3c" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M195,80 Q225,100 245,120 Q260,140 255,175" stroke="#e74c3c" stroke-width="4" fill="none" stroke-linecap="round"/>
  <text x="55" y="115" text-anchor="middle" font-size="9" font-weight="bold" fill="#c0392b">LAVA</text>
  <text x="55" y="126" text-anchor="middle" font-size="9" font-weight="bold" fill="#c0392b">FLOW</text>
  <text x="285" y="115" text-anchor="middle" font-size="9" font-weight="bold" fill="#c0392b">LAVA</text>
  <text x="285" y="126" text-anchor="middle" font-size="9" font-weight="bold" fill="#c0392b">FLOW</text>
</svg>