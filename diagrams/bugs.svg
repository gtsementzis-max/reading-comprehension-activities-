<svg viewBox="0 0 340 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="340" height="200" fill="#eef8ec" rx="8"/>
  <text x="170" y="16" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1a4a10" text-anchor="middle">INSECT ANATOMY</text>
  <!-- Antennae -->
  <line x1="155" y1="45" x2="130" y2="22" stroke="#333" stroke-width="2"/>
  <circle cx="128" cy="20" r="4" fill="#333"/>
  <line x1="165" y1="45" x2="190" y2="22" stroke="#333" stroke-width="2"/>
  <circle cx="192" cy="20" r="4" fill="#333"/>
  <!-- HEAD -->
  <ellipse cx="160" cy="55" rx="22" ry="20" fill="#2a6a22" stroke="#1a4a14" stroke-width="2"/>
  <!-- Eyes -->
  <circle cx="148" cy="50" r="6" fill="#88cc44" stroke="#1a4a14" stroke-width="1.5"/>
  <circle cx="172" cy="50" r="6" fill="#88cc44" stroke="#1a4a14" stroke-width="1.5"/>
  <circle cx="149" cy="50" r="3" fill="#111"/>
  <circle cx="173" cy="50" r="3" fill="#111"/>
  <!-- THORAX -->
  <rect x="138" y="78" width="44" height="48" rx="10" fill="#348a28" stroke="#1a4a14" stroke-width="2"/>
  <!-- 6 LEGS (3 each side) -->
  <line x1="138" y1="88" x2="108" y2="78" stroke="#1a4a14" stroke-width="2.5"/>
  <line x1="108" y1="78" x2="88" y2="88" stroke="#1a4a14" stroke-width="2"/>
  <line x1="138" y1="100" x2="105" y2="98" stroke="#1a4a14" stroke-width="2.5"/>
  <line x1="105" y1="98" x2="82" y2="105" stroke="#1a4a14" stroke-width="2"/>
  <line x1="138" y1="114" x2="110" y2="120" stroke="#1a4a14" stroke-width="2.5"/>
  <line x1="110" y1="120" x2="88" y2="130" stroke="#1a4a14" stroke-width="2"/>
  <line x1="182" y1="88" x2="212" y2="78" stroke="#1a4a14" stroke-width="2.5"/>
  <line x1="212" y1="78" x2="232" y2="88" stroke="#1a4a14" stroke-width="2"/>
  <line x1="182" y1="100" x2="215" y2="98" stroke="#1a4a14" stroke-width="2.5"/>
  <line x1="215" y1="98" x2="238" y2="105" stroke="#1a4a14" stroke-width="2"/>
  <line x1="182" y1="114" x2="210" y2="120" stroke="#1a4a14" stroke-width="2.5"/>
  <line x1="210" y1="120" x2="232" y2="130" stroke="#1a4a14" stroke-width="2"/>
  <!-- Wings -->
  <ellipse cx="143" cy="90" rx="18" ry="30" fill="#88dd66" stroke="#1a4a14" stroke-width="1.5" opacity="0.7" transform="rotate(-20,143,90)"/>
  <ellipse cx="177" cy="90" rx="18" ry="30" fill="#88dd66" stroke="#1a4a14" stroke-width="1.5" opacity="0.7" transform="rotate(20,177,90)"/>
  <!-- ABDOMEN -->
  <ellipse cx="160" cy="155" rx="22" ry="30" fill="#1a5a14" stroke="#0a3a08" stroke-width="2"/>
  <!-- Abdomen stripes -->
  <line x1="140" y1="145" x2="180" y2="145" stroke="#0a3a08" stroke-width="1.5"/>
  <line x1="139" y1="155" x2="181" y2="155" stroke="#0a3a08" stroke-width="1.5"/>
  <line x1="140" y1="165" x2="180" y2="165" stroke="#0a3a08" stroke-width="1.5"/>
  <!-- Labels -->
  <text x="60" y="22" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0a4a00">ANTENNAE</text>
  <line x1="90" y1="23" x2="130" y2="22" stroke="#aaa" stroke-width="1"/>
  <text x="4" y="55" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0a4a00">HEAD</text>
  <line x1="30" y1="54" x2="138" y2="54" stroke="#aaa" stroke-width="1"/>
  <text x="4" y="102" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0a4a00">THORAX</text>
  <line x1="42" y1="101" x2="138" y2="101" stroke="#aaa" stroke-width="1"/>
  <text x="246" y="95" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0a4a00">WINGS</text>
  <text x="246" y="108" font-family="sans-serif" font-size="9" fill="#0a4a00">(2 pairs)</text>
  <text x="246" y="122" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0a4a00">LEGS</text>
  <text x="246" y="135" font-family="sans-serif" font-size="9" fill="#0a4a00">(6 total)</text>
  <text x="4" y="158" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0a4a00">ABDOMEN</text>
  <line x1="55" y1="157" x2="138" y2="157" stroke="#aaa" stroke-width="1"/>
</svg>
