<svg viewBox="0 0 340 200" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
  <rect width="340" height="200" fill="#e0f4ff"/>
  <!-- sunlight rays -->
  <line x1="170" y1="0" x2="130" y2="60" stroke="#f9e84a" stroke-width="2" opacity="0.6"/>
  <line x1="170" y1="0" x2="170" y2="70" stroke="#f9e84a" stroke-width="2" opacity="0.6"/>
  <line x1="170" y1="0" x2="210" y2="60" stroke="#f9e84a" stroke-width="2" opacity="0.6"/>
  <text x="155" y="12" font-size="8" fill="#c7a700" font-weight="bold">SUNLIGHT</text>
  <!-- ocean floor -->
  <rect x="0" y="155" width="340" height="45" fill="#c8a87a"/>
  <!-- coral structures -->
  <!-- brain coral -->
  <ellipse cx="80" cy="148" rx="32" ry="22" fill="#e74c3c" stroke="#c0392b" stroke-width="1.5"/>
  <path d="M58,148 Q65,140 72,148 Q79,156 86,148 Q93,140 100,148" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <text x="80" y="178" text-anchor="middle" font-size="8" fill="#7a1a0a" font-weight="bold">BRAIN CORAL</text>
  <!-- branching coral -->
  <line x1="175" y1="155" x2="175" y2="115" stroke="#f39c12" stroke-width="5" stroke-linecap="round"/>
  <line x1="175" y1="130" x2="158" y2="110" stroke="#f39c12" stroke-width="4" stroke-linecap="round"/>
  <line x1="175" y1="130" x2="192" y2="110" stroke="#f39c12" stroke-width="4" stroke-linecap="round"/>
  <line x1="158" y1="118" x2="148" y2="105" stroke="#f39c12" stroke-width="3" stroke-linecap="round"/>
  <line x1="192" y1="118" x2="202" y2="105" stroke="#f39c12" stroke-width="3" stroke-linecap="round"/>
  <text x="175" y="178" text-anchor="middle" font-size="8" fill="#884707" font-weight="bold">BRANCHING CORAL</text>
  <!-- sea anemone -->
  <ellipse cx="268" cy="152" rx="16" ry="10" fill="#9b59b6"/>
  <line x1="255" y1="152" x2="248" y2="138" stroke="#9b59b6" stroke-width="3" stroke-linecap="round"/>
  <line x1="260" y1="148" x2="255" y2="133" stroke="#8e44ad" stroke-width="3" stroke-linecap="round"/>
  <line x1="268" y1="145" x2="268" y2="130" stroke="#9b59b6" stroke-width="3" stroke-linecap="round"/>
  <line x1="276" y1="148" x2="281" y2="133" stroke="#8e44ad" stroke-width="3" stroke-linecap="round"/>
  <line x1="281" y1="152" x2="288" y2="138" stroke="#9b59b6" stroke-width="3" stroke-linecap="round"/>
  <text x="268" y="178" text-anchor="middle" font-size="8" fill="#6c3483" font-weight="bold">SEA ANEMONE</text>
  <!-- fish 1 -->
  <ellipse cx="130" cy="90" rx="14" ry="8" fill="#2e86de"/>
  <polygon points="144,90 154,83 154,97" fill="#1a6ab8"/>
  <circle cx="122" cy="87" r="3" fill="white"/>
  <circle cx="122" cy="87" r="1.5" fill="#0d4a88"/>
  <!-- fish 2 -->
  <ellipse cx="240" cy="75" rx="12" ry="7" fill="#f39c12"/>
  <line x1="232" y1="72" x2="232" y2="82" stroke="#f39c12" stroke-width="2"/>
  <line x1="234" y1="72" x2="234" y2="82" stroke="#f39c12" stroke-width="2"/>
  <polygon points="252,75 260,70 260,80" fill="#e67e22"/>
  <circle cx="240" cy="73" r="2.5" fill="white"/>
  <circle cx="240" cy="73" r="1.2" fill="#884707"/>
  <!-- polyp label -->
  <text x="35" y="120" font-size="9" fill="#c0392b" font-weight="bold">POLYP</text>
  <line x1="55" y1="122" x2="62" y2="132" stroke="#c0392b" stroke-width="1"/>
  <text x="170" y="197" text-anchor="middle" font-size="11" fill="#1565c0" font-weight="bold">Coral Reef Ecosystem</text>
</svg>
