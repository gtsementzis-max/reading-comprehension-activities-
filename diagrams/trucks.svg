<svg viewBox="0 0 340 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="340" height="200" fill="#f0f2f5" rx="8"/>
  <text x="170" y="16" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1a2a4a" text-anchor="middle">SEMI-TRUCK PARTS</text>
  <!-- Road -->
  <rect x="0" y="160" width="340" height="40" fill="#aaa" rx="0"/>
  <line x1="0" y1="178" x2="340" y2="178" stroke="#fff" stroke-width="3" stroke-dasharray="20,15"/>
  <!-- Trailer (back) -->
  <rect x="148" y="70" width="178" height="88" rx="5" fill="#c8c8d8" stroke="#8888aa" stroke-width="2"/>
  <!-- Trailer doors -->
  <line x1="237" y1="70" x2="237" y2="158" stroke="#8888aa" stroke-width="1.5"/>
  <circle cx="240" cy="115" r="4" fill="#668"/>
  <!-- Cab (front) -->
  <rect x="28" y="80" width="120" height="78" rx="6" fill="#cc3322" stroke="#882200" stroke-width="2"/>
  <!-- Windshield -->
  <rect x="75" y="87" width="65" height="38" rx="4" fill="#aaddff" stroke="#446688" stroke-width="1.5"/>
  <!-- Door window -->
  <rect x="36" y="90" width="32" height="28" rx="3" fill="#aaddff" stroke="#446688" stroke-width="1.5"/>
  <!-- Door handle -->
  <line x1="58" y1="114" x2="65" y2="114" stroke="#888" stroke-width="2"/>
  <!-- Engine bump (front of cab) -->
  <rect x="15" y="98" width="25" height="40" rx="4" fill="#a82a1a" stroke="#882200" stroke-width="1.5"/>
  <!-- Exhaust pipe -->
  <rect x="68" y="45" width="8" height="38" rx="3" fill="#666" stroke="#444" stroke-width="1.5"/>
  <ellipse cx="72" cy="44" rx="6" ry="4" fill="#888"/>
  <!-- Fuel tank -->
  <rect x="138" y="118" width="12" height="38" rx="4" fill="#888" stroke="#555" stroke-width="1.5"/>
  <!-- Wheels -->
  <circle cx="68" cy="160" r="22" fill="#333" stroke="#111" stroke-width="2"/>
  <circle cx="68" cy="160" r="12" fill="#666"/>
  <circle cx="68" cy="160" r="4" fill="#999"/>
  <circle cx="225" cy="160" r="22" fill="#333" stroke="#111" stroke-width="2"/>
  <circle cx="225" cy="160" r="12" fill="#666"/>
  <circle cx="225" cy="160" r="4" fill="#999"/>
  <circle cx="280" cy="160" r="22" fill="#333" stroke="#111" stroke-width="2"/>
  <circle cx="280" cy="160" r="12" fill="#666"/>
  <circle cx="280" cy="160" r="4" fill="#999"/>
  <!-- Labels -->
  <line x1="40" y1="78" x2="40" y2="30" stroke="#aaa" stroke-width="1"/>
  <text x="40" y="27" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1a2a4a" text-anchor="middle">CAB</text>
  <line x1="72" y1="44" x2="90" y2="25" stroke="#aaa" stroke-width="1"/>
  <text x="92" y="22" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1a2a4a">EXHAUST PIPE</text>
  <line x1="145" y1="118" x2="160" y2="104" stroke="#aaa" stroke-width="1"/>
  <text x="163" y="101" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1a2a4a">FUEL TANK</text>
  <line x1="237" y1="80" x2="290" y2="55" stroke="#aaa" stroke-width="1"/>
  <text x="293" y="52" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1a2a4a">TRAILER</text>
  <line x1="68" y1="138" x2="30" y2="125" stroke="#aaa" stroke-width="1"/>
  <text x="28" y="122" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1a2a4a" text-anchor="end">WHEELS</text>
  <line x1="22" y1="108" x2="4" y2="96" stroke="#aaa" stroke-width="1"/>
  <text x="2" y="93" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1a2a4a" text-anchor="end">ENGINE</text>
</svg>
