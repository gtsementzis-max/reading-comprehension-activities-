<svg viewBox="0 0 340 200" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
  <rect width="340" height="200" fill="#e8f4f8"/>
  <!-- ocean floor -->
  <rect x="0" y="168" width="340" height="32" fill="#c8a87a" opacity="0.6"/>
  <!-- rocks -->
  <ellipse cx="30" cy="170" rx="20" ry="8" fill="#9e9e9e" opacity="0.7"/>
  <ellipse cx="300" cy="172" rx="18" ry="7" fill="#9e9e9e" opacity="0.7"/>
  <!-- ink cloud -->
  <ellipse cx="280" cy="140" rx="28" ry="16" fill="#424242" opacity="0.3"/>
  <text x="280" y="145" text-anchor="middle" font-size="8" fill="#212121" font-weight="bold">INK</text>
  <!-- mantle (body) -->
  <ellipse cx="170" cy="65" rx="48" ry="35" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <!-- eyes -->
  <ellipse cx="155" cy="58" rx="10" ry="8" fill="white" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="155" cy="58" r="5" fill="#1a1a2e"/>
  <circle cx="153" cy="56" r="2" fill="white"/>
  <ellipse cx="185" cy="58" rx="10" ry="8" fill="white" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="185" cy="58" r="5" fill="#1a1a2e"/>
  <circle cx="183" cy="56" r="2" fill="white"/>
  <!-- 8 arms -->
  <path d="M140,95 Q120,120 110,150" fill="none" stroke="#c0392b" stroke-width="8" stroke-linecap="round"/>
  <path d="M150,98 Q135,130 130,165" fill="none" stroke="#e74c3c" stroke-width="8" stroke-linecap="round"/>
  <path d="M165,100 Q160,135 158,168" fill="none" stroke="#c0392b" stroke-width="8" stroke-linecap="round"/>
  <path d="M180,100 Q182,135 182,168" fill="none" stroke="#e74c3c" stroke-width="8" stroke-linecap="round"/>
  <path d="M195,98 Q205,132 210,165" fill="none" stroke="#c0392b" stroke-width="8" stroke-linecap="round"/>
  <path d="M207,94 Q225,125 235,155" fill="none" stroke="#e74c3c" stroke-width="8" stroke-linecap="round"/>
  <path d="M215,88 Q240,112 255,140" fill="none" stroke="#c0392b" stroke-width="8" stroke-linecap="round"/>
  <path d="M125,88 Q100,108 88,135" fill="none" stroke="#e74c3c" stroke-width="8" stroke-linecap="round"/>
  <!-- suckers on one arm -->
  <circle cx="110" cy="130" r="3" fill="#ffd" stroke="#c0392b" stroke-width="1"/>
  <circle cx="112" cy="142" r="3" fill="#ffd" stroke="#c0392b" stroke-width="1"/>
  <circle cx="111" cy="154" r="3" fill="#ffd" stroke="#c0392b" stroke-width="1"/>
  <!-- labels -->
  <text x="170" y="30" text-anchor="middle" font-size="9" fill="#922b21" font-weight="bold">MANTLE</text>
  <line x1="170" y1="32" x2="170" y2="40" stroke="#922b21" stroke-width="1"/>
  <text x="58" y="88" font-size="9" fill="#922b21" font-weight="bold">8 ARMS</text>
  <line x1="82" y1="92" x2="96" y2="100" stroke="#922b21" stroke-width="1"/>
  <text x="75" y="144" font-size="9" fill="#922b21" font-weight="bold">SUCKERS</text>
  <line x1="105" y1="142" x2="110" y2="140" stroke="#922b21" stroke-width="1"/>
  <text x="140" y="48" font-size="9" fill="#922b21" font-weight="bold">EYE</text>
  <line x1="148" y1="52" x2="152" y2="56" stroke="#922b21" stroke-width="1"/>
  <text x="170" y="193" text-anchor="middle" font-size="11" fill="#922b21" font-weight="bold">The Octopus</text>
</svg>
